<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotes - EE 7+</title>
    <script src="Layout/theme.js"></script>
    <script src="Layout/quotes.js"></script>
    <style>
      :root[data-theme="dusk"] {
        --bg: #2e2a24;
        --surface: #352f28;
        --surface-raised: #3d362e;
        --text: #ddd5c8;
        --text-dim: #8c8078;
        --accent: #e07820;
        --accent-dim: rgba(224, 120, 32, 0.18);
        --border: #4a3c30;
        --danger: #efb2a7;
      }
      :root[data-theme="light"] {
        --bg: #f7f4f0;
        --surface: #ffffff;
        --surface-raised: #fffaf4;
        --text: #1a160e;
        --text-dim: #8f8478;
        --accent: #c06010;
        --accent-dim: rgba(192, 96, 16, 0.1);
        --border: #d5cfc6;
        --danger: #a33d2c;
      }
      :root[data-theme="dark"] {
        --bg: #17191b;
        --surface: #222629;
        --surface-raised: #2a2f32;
        --text: #f2f3f0;
        --text-dim: #aeb5b8;
        --accent: #ef8b32;
        --accent-dim: rgba(239, 139, 50, 0.16);
        --border: #343a3d;
        --danger: #ffc5bb;
      }
      :root[data-theme="dawn"] {
        --bg: #d96720;
        --surface: #ed7d2c;
        --surface-raised: #f08b42;
        --text: #fff4e5;
        --text-dim: #ffe0be;
        --accent: #fff7e8;
        --accent-dim: rgba(255, 247, 232, 0.16);
        --border: rgba(82, 28, 6, 0.28);
        --danger: #fff0d5;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, "Arial Unicode MS", Geneva, sans-serif;
        font-size: 10pt;
        line-height: 1.5;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        font: inherit;
      }

      #page {
        max-width: 880px;
        margin: 0 auto;
        padding: 50px 24px 64px;
      }

      #hero {
        padding-bottom: 22px;
      }

      #hero-title {
        font-size: 19pt;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-bottom: 5px;
      }

      #hero-sub,
      #status {
        color: var(--text-dim);
        font-size: 8.5pt;
      }

      #status {
        min-height: 18px;
        margin-bottom: 8px;
      }

      #list {
        display: grid;
        gap: 12px;
      }

      .quote-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 17px 18px 13px;
      }

      .quote-text {
        border-left: 3px solid var(--accent);
        color: var(--text);
        display: -webkit-box;
        font-size: 11pt;
        line-height: 1.62;
        margin: 0;
        overflow: hidden;
        padding: 1px 0 2px 15px;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
        overflow-wrap: anywhere;
      }

      .quote-preview {
        cursor: pointer;
        outline: none;
      }

      .quote-author {
        color: var(--text);
        display: block;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 9pt;
        font-style: italic;
        font-weight: 600;
        margin: 8px 0 0 18px;
      }

      .quote-preview:focus-visible {
        border-radius: 3px;
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }

      .quote-card.is-expanded .quote-text {
        display: block;
      }

      .quote-expand-label {
        color: var(--text-dim);
        display: block;
        font-size: 7.75pt;
        margin: 8px 0 0 18px;
      }

      .quote-card.is-expanded .quote-expand-label {
        color: var(--accent);
      }

      .quote-card-footer {
        align-items: center;
        border-top: 1px solid var(--border);
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) auto;
        margin-top: 14px;
        padding-top: 10px;
      }

      .quote-source {
        color: var(--text-dim);
        font-size: 8.5pt;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .quote-card-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .quote-open {
        border: 1px solid var(--accent);
        border-radius: 5px;
        font-size: 8pt;
        line-height: 1;
        padding: 7px 9px;
        white-space: nowrap;
      }

      .quote-open {
        background: var(--accent);
        color: #fffaf3;
      }

      .quote-open:hover,
      .quote-open:focus-visible {
        background: var(--text);
        border-color: var(--text);
        color: var(--bg);
        text-decoration: none;
      }

      .quote-delete {
        background: transparent;
        border: 0;
        color: var(--text-dim);
        cursor: pointer;
        flex-shrink: 0;
        font-size: 8pt;
        padding: 3px 0;
      }

      .quote-delete:hover,
      .quote-delete:focus-visible {
        color: var(--danger);
      }

      .quotes-empty {
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        padding: 24px 0;
      }

      #delete-modal {
        align-items: center;
        display: grid;
        inset: 0;
        justify-items: center;
        padding: 20px;
        position: fixed;
        z-index: 30;
      }

      #delete-modal[hidden] {
        display: none;
      }

      .delete-modal-backdrop {
        background: rgba(0, 0, 0, 0.58);
        inset: 0;
        position: absolute;
      }

      .delete-modal-card {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 18px 56px rgba(0, 0, 0, 0.34);
        max-width: 390px;
        padding: 22px;
        position: relative;
        width: 100%;
      }

      .delete-modal-title {
        font-size: 13pt;
        font-weight: 700;
        margin: 0 0 7px;
      }

      .delete-modal-copy {
        color: var(--text-dim);
        margin: 0;
      }

      .delete-modal-actions {
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        margin-top: 20px;
      }

      .modal-btn {
        border: 1px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
        padding: 8px 12px;
      }

      .modal-btn--cancel {
        background: transparent;
        color: var(--text);
      }

      .modal-btn--confirm {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--bg);
      }

      @media (max-width: 700px) {
        #page {
          padding: 34px 16px 48px;
        }

        .quote-card {
          padding: 14px 14px 11px;
        }

        .quote-card-footer {
          align-items: stretch;
          grid-template-columns: 1fr;
        }

        .quote-card-actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main id="page">
      <div id="hero">
        <div id="hero-title">Quotes</div>
        <div id="hero-sub">Passages you saved while reading, stored locally in this browser.</div>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="list"></div>
    </main>

    <div id="delete-modal" hidden role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" aria-describedby="delete-modal-copy">
      <div class="delete-modal-backdrop" data-modal-close></div>
      <section class="delete-modal-card">
        <h2 class="delete-modal-title" id="delete-modal-title">Delete this quote?</h2>
        <p class="delete-modal-copy" id="delete-modal-copy">This removes the saved passage from this browser and clears its reader highlight.</p>
        <div class="delete-modal-actions">
          <button class="modal-btn modal-btn--cancel" id="delete-cancel" type="button">Cancel</button>
          <button class="modal-btn modal-btn--confirm" id="delete-confirm" type="button">Delete quote</button>
        </div>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        var THEME_KEY = "ee7-theme";
        var list = document.getElementById("list");
        var status = document.getElementById("status");
        var modal = document.getElementById("delete-modal");
        var cancelButton = document.getElementById("delete-cancel");
        var confirmButton = document.getElementById("delete-confirm");
        var pendingDeleteId = "";
        var restoreFocus = null;

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme || "dusk");
        }

        try {
          applyTheme(localStorage.getItem(THEME_KEY) || "dusk");
        } catch (e) {
          applyTheme("dusk");
        }

        window.addEventListener("message", function (event) {
          if (event.data && event.data.type === "ee7-theme") {
            applyTheme(event.data.theme);
          }
        });

        function render() {
          var items = window.EE7Quotes
            ? window.EE7Quotes.renderQuotesPage(list)
            : [];
          status.textContent = items.length
            ? items.length + " saved quote" + (items.length === 1 ? "" : "s")
            : "";
        }

        function toggleQuotePreview(preview) {
          var card = preview.closest(".quote-card");
          if (!card) return;
          var expanded = card.classList.toggle("is-expanded");
          preview.setAttribute("aria-expanded", expanded ? "true" : "false");
          var label = preview.querySelector(".quote-expand-label");
          if (label) label.textContent = expanded ? "Show less" : "Show full quote";
        }

        function closeDeleteModal() {
          pendingDeleteId = "";
          modal.setAttribute("hidden", "true");
          if (restoreFocus && restoreFocus.focus) restoreFocus.focus();
          restoreFocus = null;
        }

        function openDeleteModal(id, trigger) {
          pendingDeleteId = id || "";
          restoreFocus = trigger || null;
          if (!pendingDeleteId) return;
          modal.removeAttribute("hidden");
          window.requestAnimationFrame(function () {
            cancelButton.focus();
          });
        }

        function confirmDelete() {
          if (!pendingDeleteId || !window.EE7Quotes) {
            closeDeleteModal();
            return;
          }
          var removed = window.EE7Quotes.deleteQuote(pendingDeleteId);
          closeDeleteModal();
          if (removed) {
            render();
            status.textContent = "Quote deleted";
          }
        }

        list.addEventListener("click", function (event) {
          var deleteButton = event.target.closest("[data-quote-delete]");
          if (deleteButton) {
            event.preventDefault();
            event.stopPropagation();
            openDeleteModal(
              deleteButton.getAttribute("data-quote-delete"),
              deleteButton,
            );
            return;
          }

          var preview = event.target.closest("[data-quote-expand]");
          if (preview) toggleQuotePreview(preview);
        });

        list.addEventListener("keydown", function (event) {
          if (event.key !== "Enter" && event.key !== " ") return;
          var preview = event.target.closest("[data-quote-expand]");
          if (!preview) return;
          event.preventDefault();
          toggleQuotePreview(preview);
        });

        modal.addEventListener("click", function (event) {
          if (event.target.closest("[data-modal-close]")) closeDeleteModal();
        });
        cancelButton.addEventListener("click", closeDeleteModal);
        confirmButton.addEventListener("click", confirmDelete);
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && !modal.hasAttribute("hidden")) {
            closeDeleteModal();
          }
        });

        window.addEventListener("storage", function (event) {
          if (event && event.key === "ee7-quotes") render();
        });
        window.addEventListener("ee7-quotes-changed", render);
        window.addEventListener("load", render);
      })();
    </script>
  </body>
</html>
