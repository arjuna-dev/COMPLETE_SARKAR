<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotes - EE 7+</title>
    <script src="Layout/theme.js"></script>
    <script src="Layout/quotes.js"></script>
    <style>
      :root[data-theme="dusk"] {
        --bg: #2e2a24;
        --surface: #352f28;
        --text: #ddd5c8;
        --text-dim: #8c8078;
        --accent: #e07820;
        --accent-dim: rgba(224, 120, 32, 0.18);
        --border: #4a3c30;
      }
      :root[data-theme="light"] {
        --bg: #f7f4f0;
        --surface: #ffffff;
        --text: #1a160e;
        --text-dim: #8f8478;
        --accent: #c06010;
        --accent-dim: rgba(192, 96, 16, 0.1);
        --border: #d5cfc6;
      }
      :root[data-theme="dark"] {
        --bg: #17191b;
        --surface: #222629;
        --text: #f2f3f0;
        --text-dim: #aeb5b8;
        --accent: #ef8b32;
        --accent-dim: rgba(239, 139, 50, 0.16);
        --border: #343a3d;
      }
      :root[data-theme="dawn"] {
        --bg: #d96720;
        --surface: #ed7d2c;
        --text: #fff4e5;
        --text-dim: #ffe0be;
        --accent: #fff7e8;
        --accent-dim: rgba(255, 247, 232, 0.16);
        --border: rgba(82, 28, 6, 0.28);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, "Arial Unicode MS", Geneva, sans-serif;
        font-size: 10pt;
        line-height: 1.5;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      #page {
        max-width: 820px;
        margin: 0 auto;
        padding: 50px 24px 64px;
      }

      #hero {
        padding-bottom: 22px;
      }

      #hero-title {
        font-size: 19pt;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-bottom: 5px;
      }

      #hero-sub,
      #status {
        color: var(--text-dim);
        font-size: 8.5pt;
      }

      #status {
        min-height: 18px;
        margin-bottom: 8px;
      }

      #list {
        display: grid;
        gap: 12px;
      }

      .quote-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 17px 18px 13px;
      }

      .quote-text {
        border-left: 3px solid var(--accent);
        color: var(--text);
        display: -webkit-box;
        font-size: 11pt;
        line-height: 1.62;
        margin: 0;
        overflow: hidden;
        padding: 1px 0 2px 15px;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
        overflow-wrap: anywhere;
      }

      .quote-preview {
        cursor: pointer;
        outline: none;
      }

      .quote-preview:focus-visible {
        border-radius: 3px;
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }

      .quote-card.is-expanded .quote-text {
        display: block;
      }

      .quote-expand-label {
        color: var(--text-dim);
        display: block;
        font-size: 7.75pt;
        margin: 8px 0 0 18px;
      }

      .quote-card.is-expanded .quote-expand-label {
        color: var(--accent);
      }

      .quote-card-footer {
        align-items: center;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 14px;
        padding-top: 10px;
      }

      .quote-source {
        color: var(--text-dim);
        font-size: 8.5pt;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .quote-delete {
        background: transparent;
        border: 0;
        color: var(--text-dim);
        cursor: pointer;
        flex-shrink: 0;
        font: inherit;
        font-size: 8pt;
        padding: 3px 0;
      }

      .quote-delete:hover,
      .quote-delete:focus-visible {
        color: var(--text);
      }

      .quotes-empty {
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        padding: 24px 0;
      }

      @media (max-width: 560px) {
        #page {
          padding: 34px 16px 48px;
        }

        .quote-card {
          padding: 14px 14px 11px;
        }
      }
    </style>
  </head>
  <body>
    <main id="page">
      <div id="hero">
        <div id="hero-title">Quotes</div>
        <div id="hero-sub">Passages you saved while reading, stored locally in this browser.</div>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="list"></div>
    </main>

    <script>
      (function () {
        "use strict";

        var THEME_KEY = "ee7-theme";

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
        }

        try {
          applyTheme(localStorage.getItem(THEME_KEY) || "dusk");
        } catch (e) {
          applyTheme("dusk");
        }

        window.addEventListener("message", function (event) {
          if (event.data && event.data.type === "ee7-theme") {
            applyTheme(event.data.theme);
          }
        });

        function render() {
          var list = document.getElementById("list");
          var items = window.EE7Quotes
            ? window.EE7Quotes.renderQuotesPage(list)
            : [];
          document.getElementById("status").textContent = items.length
            ? items.length + " saved quote" + (items.length === 1 ? "" : "s")
            : "";
        }

        function toggleQuotePreview(preview) {
          var card = preview.closest(".quote-card");
          if (!card) return;
          var expanded = card.classList.toggle("is-expanded");
          preview.setAttribute("aria-expanded", expanded ? "true" : "false");
          var label = preview.querySelector(".quote-expand-label");
          if (label) {
            label.textContent = expanded ? "Show less" : "Show full quote";
          }
        }

        document.getElementById("list").addEventListener("click", function (event) {
          var preview = event.target.closest("[data-quote-expand]");
          if (preview) {
            toggleQuotePreview(preview);
            return;
          }

          var deleteButton = event.target.closest("[data-quote-delete]");
          if (deleteButton) {
            event.preventDefault();
            event.stopPropagation();
            if (window.EE7Quotes) {
              window.EE7Quotes.deleteQuote(deleteButton.getAttribute("data-quote-delete"));
              render();
            }
            return;
          }

          var link = event.target.closest("a.quote-source[href]");
          if (!link || window.parent === window) return;
          event.preventDefault();
          window.parent.postMessage(
            { type: "ee7-navigate", href: link.getAttribute("href") },
            "*",
          );
        });

        document.getElementById("list").addEventListener("keydown", function (event) {
          if (event.key !== "Enter" && event.key !== " ") return;
          var preview = event.target.closest("[data-quote-expand]");
          if (!preview) return;
          event.preventDefault();
          toggleQuotePreview(preview);
        });

        window.addEventListener("storage", function (event) {
          if (event && event.key === "ee7-quotes") render();
        });
        window.addEventListener("ee7-quotes-changed", render);
        window.addEventListener("load", render);
      })();
    </script>
  </body>
</html>
