<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search — EE 7+</title>
    <script src="search_index.js"></script>
    <script src="filter_sets.js"></script>
    <script src="Layout/favorites.js"></script>
    <style>
      :root[data-theme="dark"] {
        --bg: #2e2a24;
        --text: #ddd5c8;
        --text-dim: #8c8078;
        --text-mid: #a09088;
        --accent: #e07820;
        --accent-dim: rgba(224, 120, 32, 0.18);
        --border: #3e3228;
        --mark-bg: rgba(224, 120, 32, 0.28);
        --input-bg: #352f28;
        --input-border: #4a3c30;
        --input-focus: #e07820;
      }
      :root[data-theme="light"] {
        --bg: #f7f4f0;
        --text: #1a160e;
        --text-dim: #9a8e80;
        --text-mid: #6a6050;
        --accent: #c06010;
        --accent-dim: rgba(192, 96, 16, 0.1);
        --border: #d5cfc6;
        --mark-bg: rgba(192, 96, 16, 0.22);
        --input-bg: #ffffff;
        --input-border: #c8c0b4;
        --input-focus: #c06010;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, "Arial Unicode MS", Geneva, sans-serif;
        font-size: 10pt;
        line-height: 1.5;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      #page {
        min-height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 0 24px 60px;
      }

      /* Hero — collapses once results appear */
      #hero {
        padding: 60px 0 28px;
        text-align: center;
        transition: padding 0.25s;
      }
      #hero.has-results {
        padding: 22px 0 16px;
      }

      #hero-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 26px;
      }
      #hero.has-results #hero-header {
        display: none;
      }

      #hero-photo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        object-position: top center;
        border: 2px solid var(--border);
        flex-shrink: 0;
        opacity: 0.88;
      }

      #hero-title {
        font-size: 15pt;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text);
        margin-bottom: 4px;
      }
      #hero-sub {
        font-size: 8.5pt;
        color: var(--text-dim);
        margin-bottom: 0;
      }
      /* hero-header (title + photo) hides when results appear */

      /* Search input */
      #search-wrap {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #search-input-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #search-input {
        width: 100%;
        background: var(--input-bg);
        border: 1.5px solid var(--input-border);
        border-radius: 28px;
        padding: 13px 46px 13px 20px;
        font-family: inherit;
        font-size: 11.5pt;
        color: var(--text);
        outline: none;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
        -webkit-appearance: none;
      }
      #search-input::placeholder {
        color: var(--text-dim);
      }
      #search-input:focus {
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }
      #search-input::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }
      #search-icon {
        position: absolute;
        right: 17px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        pointer-events: none;
      }

      /* ── Random discourse button ───────────────────────── */
      #random-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: none;
        color: var(--text-dim);
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
        padding: 0;
      }
      #random-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }
      #search-hint {
        margin-top: 9px;
        font-size: 7.5pt;
        color: var(--text-dim);
        text-align: center;
      }

      /* Status */
      #status {
        font-size: 8pt;
        color: var(--text-dim);
        padding: 8px 0 2px;
        min-height: 20px;
      }

      /* Results */
      #results.two-column {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }
      .result-column {
        min-width: 0;
      }
      .result-column-title {
        margin: 20px 0 0;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 10pt;
        line-height: 1.3;
      }
      .result-column-count {
        color: var(--text-dim);
        font-size: 8pt;
        font-weight: 400;
      }
      .result-column-empty {
        margin: 22px 0 0;
        color: var(--text-dim);
        font-size: 8.5pt;
        font-style: italic;
      }
      #results.two-column #show-more-btn {
        grid-column: 1 / -1;
      }

      /* Mobile result tabs */
      #mobile-result-tabs {
        display: none;
      }
      .mobile-result-tab {
        min-width: 0;
        padding: 9px 8px 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 8.5pt;
        line-height: 1.3;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .mobile-result-tab:hover {
        color: var(--accent);
      }
      .mobile-result-tab[aria-selected="true"] {
        border-bottom-color: var(--accent);
        color: var(--accent);
        font-weight: 700;
      }
      .mobile-result-tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .mobile-result-tab-count {
        color: var(--text-dim);
        font-size: 7.5pt;
        font-weight: 400;
      }
      .result-group {
        margin-top: 22px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }
      .result-group:last-child {
        border-bottom: none;
      }
      .result-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10.5pt;
        font-weight: 700;
        margin-bottom: 5px;
        line-height: 1.3;
      }
      .result-title-link {
        min-width: 0;
        flex: 1;
      }
      .result-title a {
        color: var(--accent);
      }
      .result-title a:hover {
        color: var(--text);
        text-decoration: none;
      }
      .result-count {
        font-size: 8pt;
        color: var(--text-dim);
        font-weight: 400;
        margin-left: 2px;
        flex-shrink: 0;
      }
      .result-source {
        font-size: 7.5pt;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 2px 7px;
        font-weight: 400;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .result-snippet {
        font-size: 8.5pt;
        color: var(--text-mid);
        line-height: 1.6;
        margin: 4px 0 2px;
      }
      .result-anchor {
        display: inline-block;
        font-size: 7.5pt;
        color: var(--text-dim);
        background: var(--accent-dim);
        border-radius: 3px;
        padding: 1px 5px;
        margin-right: 6px;
        text-decoration: none;
        transition:
          background 0.14s,
          color 0.14s;
      }
      .result-anchor:hover {
        background: var(--accent);
        color: #fff;
      }
      .result-title mark,
      .result-snippet mark {
        background: var(--mark-bg);
        color: var(--text);
        border-radius: 2px;
        padding: 0 2px;
        font-weight: 600;
      }
      #show-more-btn {
        display: block;
        margin: 24px auto 0;
        padding: 9px 28px;
        background: none;
        border: 1.5px solid var(--border);
        border-radius: 20px;
        color: var(--text-mid);
        font-family: inherit;
        font-size: 8.5pt;
        cursor: pointer;
        transition:
          border-color 0.16s,
          color 0.16s,
          background 0.16s;
      }
      #show-more-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }

      /* Corpus scope toggle */
      #corpus-toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        color: var(--text-mid);
        font-size: 8.5pt;
        cursor: pointer;
        user-select: none;
      }
      #corpus-toggle input {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--accent);
      }
      #corpus-toggle.disabled {
        cursor: default;
        opacity: 0.55;
      }

      /* ── Filter chips ──────────────────────────────────────── */
      #filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-top: 12px;
      }
      #filter-bar.hidden {
        display: none;
      }
      .filter-chip {
        padding: 4px 14px;
        border-radius: 14px;
        border: 1.5px solid var(--border);
        background: none;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 8pt;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
        white-space: nowrap;
      }
      .filter-chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .filter-chip.active {
        border-color: var(--accent);
        background: var(--accent-dim);
        color: var(--accent);
        font-weight: 600;
      }
      @media (max-width: 680px) {
        #mobile-result-tabs.visible {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0;
          margin-top: 16px;
          border-bottom: 1px solid var(--border);
        }
        #results.two-column {
          display: block;
        }
        .result-column + .result-column {
          margin-top: 0;
        }
        #results.two-column[data-active-tab="discourses"]
          .result-column-stories,
        #results.two-column[data-active-tab="stories"]
          .result-column-discourses {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="hero">
        <div id="hero-header">
          <div>
            <p id="hero-title">Works of P.R. Sarkar</p>
            <p id="hero-sub">
              Full-text search across 1,600+ discourses, with optional Baba stories
            </p>
          </div>
          <img id="hero-photo" src="Images/Sarkar.jpg" alt="P.R. Sarkar" />
        </div>
        <div id="search-wrap">
          <div id="search-input-wrap">
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Search discourses…"
              aria-label="Search discourses"
            />
            <svg
              id="search-icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="6.5" cy="6.5" r="4.5" />
              <line x1="10" y1="10" x2="14" y2="14" />
            </svg>
          </div>
          <button
            id="random-btn"
            type="button"
            aria-label="Open a random discourse or Baba story"
            title="Random discourse or Baba story"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="1" y="1" width="14" height="14" rx="3" />
              <circle cx="5" cy="5" r="1" fill="currentColor" stroke="none" />
              <circle cx="11" cy="5" r="1" fill="currentColor" stroke="none" />
              <circle cx="5" cy="11" r="1" fill="currentColor" stroke="none" />
              <circle cx="11" cy="11" r="1" fill="currentColor" stroke="none" />
              <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>
        <p id="search-hint">
          Type at least 3 characters &nbsp;·&nbsp; diacritics ignored:
          <em>siva</em> finds <em>Śiva</em>
        </p>
        <label id="corpus-toggle">
          <input id="include-stories" type="checkbox" />
          <span>Include Baba stories</span>
        </label>
        <div id="filter-bar" class="hidden" aria-label="Filter by set"></div>
      </div>

      <div id="status"></div>
      <div
        id="mobile-result-tabs"
        role="tablist"
        aria-label="Search result type"
        aria-hidden="true"
      ></div>
      <div id="results"></div>
    </div>

    <script>
      (function () {
        "use strict";

        var THEME_KEY = "ee7-theme";

        function applyTheme(t) {
          document.documentElement.setAttribute("data-theme", t);
        }
        // init from localStorage
        (function () {
          var t = "dark";
          try {
            t = localStorage.getItem(THEME_KEY) || "dark";
          } catch (e) {}
          applyTheme(t);
        })();
        // listen for parent messages
        window.addEventListener("message", function (e) {
          if (e.data && e.data.type === "ee7-theme") applyTheme(e.data.theme);
        });

        var MAX_GROUPS = 30,
          PAGE_SIZE = 30,
          MAX_SNIPPETS = 3,
          CONTEXT_LEN = 100,
          DEBOUNCE_MS = 200,
          MIN_QUERY = 3;

        // State for incremental loading
        var _allResults = [],
          _shownCount = 0;

        // Filter state. A custom filter set applies to discourse files;
        // the corpus toggle controls whether story entries are included.
        var _activeFilter = null;
        var _activeFilterName = null;
        var FILTER_KEY = "ee7-active-filter";
        var _includeStories = false;
        var STORIES_KEY = "ee7-include-stories";
        var _activeMobileTab = null;

        function buildFilterBar() {
          var bar = document.getElementById("filter-bar");
          if (typeof filterSets === "undefined") return;
          var keys = Object.keys(filterSets);
          // Only show the bar if there's more than just "All"
          if (keys.length <= 1) return;
          bar.classList.remove("hidden");
          // Restore saved filter from localStorage, fall back to first key
          var savedName = null;
          try {
            savedName = localStorage.getItem(FILTER_KEY);
          } catch (e) {}
          if (
            !savedName ||
            !Object.prototype.hasOwnProperty.call(filterSets, savedName)
          ) {
            savedName = keys[0];
          }
          _activeFilterName = savedName;
          _activeFilter = makeFilterLookup(filterSets[savedName]);
          keys.forEach(function (name) {
            var btn = document.createElement("button");
            btn.className =
              "filter-chip" + (name === _activeFilterName ? " active" : "");
            btn.textContent = name;
            btn.onclick = function () {
              _activeFilterName = name;
              _activeFilter = makeFilterLookup(filterSets[name]);
              try {
                localStorage.setItem(FILTER_KEY, name);
              } catch (e) {}
              bar.querySelectorAll(".filter-chip").forEach(function (c) {
                c.classList.toggle("active", c.textContent === name);
              });
              rerunCurrentSearch();
            };
            bar.appendChild(btn);
          });
        }

        function makeFilterLookup(list) {
          if (!list) return null; // null = all
          var obj = Object.create(null);
          for (var i = 0; i < list.length; i++) obj[list[i]] = true;
          return obj;
        }

        function sourceOf(entry) {
          return entry.s === "stories" ? "stories" : "discourses";
        }

        function inFilter(filePath, entry) {
          if (!_activeFilter) return true;
          if (sourceOf(entry) !== "discourses") return false;
          // entry.f is like "Discourses/Some_Discourse.html" - match on basename
          var base = filePath.split("/").pop();
          return !!_activeFilter[base];
        }

        function inScope(entry) {
          if (sourceOf(entry) === "stories" && !_includeStories) return false;
          return inFilter(entry.f, entry);
        }

        function storiesInScope() {
          return _includeStories && !_activeFilter;
        }

        function updateCorpusToggle() {
          var input = document.getElementById("include-stories");
          var searchInput = document.getElementById("search-input");
          input.checked = _includeStories;
          input.setAttribute("aria-label", "Include Baba stories in search");
          searchInput.placeholder = _includeStories
            ? "Search discourses and Baba stories…"
            : "Search discourses…";
          searchInput.setAttribute(
            "aria-label",
            _includeStories
              ? "Search discourses and Baba stories"
              : "Search discourses",
          );
        }

        function initCorpusToggle() {
          var input = document.getElementById("include-stories");
          var hasStories = false;
          if (typeof searchIndex !== "undefined") {
            for (var i = 0; i < searchIndex.length; i++) {
              if (sourceOf(searchIndex[i]) === "stories") {
                hasStories = true;
                break;
              }
            }
          }
          try {
            _includeStories = localStorage.getItem(STORIES_KEY) === "true";
          } catch (e) {}
          if (!hasStories) _includeStories = false;
          input.disabled = !hasStories;
          document
            .getElementById("corpus-toggle")
            .classList.toggle("disabled", !hasStories);
          updateCorpusToggle();
          input.addEventListener("change", function () {
            _includeStories = input.checked;
            try {
              localStorage.setItem(STORIES_KEY, String(_includeStories));
            } catch (e) {}
            updateCorpusToggle();
            rerunCurrentSearch();
          });
        }

        function rerunCurrentSearch() {
          var q = document.getElementById("search-input").value;
          if (normalize(q.trim()).length < MIN_QUERY) return;
          renderResults(search(q));
        }

        function normalize(s) {
          return s
            .normalize("NFD")
            .replace(/[\u0300-\u036f\u1dc0-\u1dff\u20d0-\u20ff]/g, "")
            .toLowerCase();
        }
        function findAll(hay, needle) {
          var out = [],
            pos = 0,
            i;
          while ((i = hay.indexOf(needle, pos)) !== -1) {
            out.push(i);
            pos = i + needle.length;
          }
          return out;
        }
        function escHtml(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function makeSnippet(orig, normX, pos, qlen) {
          var s = Math.max(0, pos - CONTEXT_LEN),
            e = Math.min(orig.length, pos + qlen + CONTEXT_LEN);
          return (
            (s > 0 ? "[…] " : "") +
            escHtml(orig.slice(s, pos)) +
            "<mark>" +
            escHtml(orig.slice(pos, pos + qlen)) +
            "</mark>" +
            escHtml(orig.slice(pos + qlen, e)) +
            (e < orig.length ? " […]" : "")
          );
        }
        function highlightMatches(orig, positions, qlen) {
          var html = "",
            last = 0;
          for (var i = 0; i < positions.length; i++) {
            var pos = positions[i];
            if (pos < last) continue;
            html += escHtml(orig.slice(last, pos));
            html +=
              "<mark>" +
              escHtml(orig.slice(pos, pos + qlen)) +
              "</mark>";
            last = pos + qlen;
          }
          return html + escHtml(orig.slice(last));
        }
        function search(rawQuery) {
          var normQ = normalize(rawQuery.trim());
          if (normQ.length < MIN_QUERY) return [];
          if (typeof searchIndex === "undefined") return [];
          var map = Object.create(null),
            order = [];
          for (var i = 0; i < searchIndex.length; i++) {
            var entry = searchIndex[i];
            if (!inScope(entry)) continue;
            var normTitle = normalize(entry.t),
              titlePos = findAll(normTitle, normQ),
              normX = normalize(entry.x),
              pos = findAll(normX, normQ);
            if (!titlePos.length && !pos.length) continue;
            if (!map[entry.f]) {
              map[entry.f] = {
                t: entry.t,
                titleHtml: escHtml(entry.t),
                f: entry.f,
                source: sourceOf(entry),
                count: 0,
                titleMatched: false,
                snippets: [],
              };
              order.push(entry.f);
            }
            var g = map[entry.f];
            // The title is repeated on every paragraph entry, so count a
            // title match once per discourse rather than once per paragraph.
            if (titlePos.length && !g.titleMatched) {
              g.titleMatched = true;
              g.count += titlePos.length;
              g.titleHtml = highlightMatches(entry.t, titlePos, normQ.length);
            }
            g.count += pos.length;
            if (g.snippets.length < MAX_SNIPPETS && pos.length) {
              g.snippets.push({
                a: entry.a,
                html: makeSnippet(entry.x, normX, pos[0], normQ.length),
              });
            }
          }
          return order
            .map(function (k, index) {
              var group = map[k];
              group.order = index;
              return group;
            })
            .sort(function (a, b) {
              return b.count - a.count || a.order - b.order;
            });
        }

        function renderGroup(group) {
          var html = '<div class="result-group">';
          html +=
            '<div class="result-title"><a class="result-title-link" href="' +
            escHtml(group.f) +
            '" target="Client">' +
            group.titleHtml +
            "</a>" +
            (window.EE7Favorites
              ? window.EE7Favorites.favoriteButtonHtml(
                  { href: group.f, title: group.t },
                  { compact: true },
                )
              : "");
          html +=
            '<span class="result-source">' +
            (group.source === "stories" ? "Baba story" : "Discourse") +
            "</span>";
          html +=
            '<span class="result-count">(' +
            group.count +
            " occurrence" +
            (group.count !== 1 ? "s" : "") +
            ")</span></div>";
          for (var s = 0; s < group.snippets.length; s++) {
            var snippet = group.snippets[s];
            html +=
              '<div class="result-snippet"><a class="result-anchor" href="' +
              escHtml(group.f) +
              "#" +
              escHtml(snippet.a) +
              '" target="Client">' +
              escHtml(snippet.a) +
              "</a>" +
              snippet.html +
              "</div>";
          }
          return html + "</div>";
        }

        function renderGroups(groups) {
          return groups.map(renderGroup).join("");
        }

        function renderColumn(title, source, groups) {
          var html =
            '<section id="result-column-' +
            source +
            '" class="result-column result-column-' +
            source +
            '" aria-labelledby="mobile-tab-' +
            source +
            '"><h2 class="result-column-title">' +
            title +
            ' <span class="result-column-count">(' +
            groups.length +
            ")</span></h2>";
          html += groups.length
            ? renderGroups(groups)
            : '<p class="result-column-empty">No matches.</p>';
          return html + "</section>";
        }

        function countResultsBySource(source) {
          var count = 0;
          for (var i = 0; i < _allResults.length; i++) {
            if (_allResults[i].source === source) count++;
          }
          return count;
        }

        function mobileTabHtml(source, title, count, activeSource) {
          var selected = source === activeSource;
          return (
            '<button id="mobile-tab-' +
            source +
            '" class="mobile-result-tab" type="button" role="tab"' +
            ' data-source="' +
            source +
            '" aria-controls="result-column-' +
            source +
            '" aria-selected="' +
            String(selected) +
            '" tabindex="' +
            (selected ? "0" : "-1") +
            '">' +
            title +
            ' <span class="mobile-result-tab-count">(' +
            count +
            ")</span></button>"
          );
        }

        function renderMobileTabs(activeSource) {
          var tabs = document.getElementById("mobile-result-tabs");
          tabs.innerHTML =
            mobileTabHtml(
              "discourses",
              "Discourses",
              countResultsBySource("discourses"),
              activeSource,
            ) +
            mobileTabHtml(
              "stories",
              "Baba stories",
              countResultsBySource("stories"),
              activeSource,
            );
          tabs.classList.add("visible");
          tabs.setAttribute("aria-hidden", "false");
        }

        function hideMobileTabs() {
          var tabs = document.getElementById("mobile-result-tabs");
          tabs.classList.remove("visible");
          tabs.setAttribute("aria-hidden", "true");
          tabs.innerHTML = "";
        }

        function chooseMobileTab(discourseGroups, storyGroups) {
          var discourseCount = countResultsBySource("discourses");
          var storyCount = countResultsBySource("stories");
          if (_activeMobileTab === "discourses" && discourseCount) {
            return "discourses";
          }
          if (_activeMobileTab === "stories" && storyCount) return "stories";
          if (discourseGroups.length) return "discourses";
          if (storyGroups.length) return "stories";
          return discourseCount ? "discourses" : "stories";
        }

        function setMobileTab(source) {
          _activeMobileTab = source;
          var results = document.getElementById("results");
          if (!results.classList.contains("two-column")) return;
          results.setAttribute("data-active-tab", source);
          var buttons = document.querySelectorAll(".mobile-result-tab");
          for (var i = 0; i < buttons.length; i++) {
            var selected = buttons[i].getAttribute("data-source") === source;
            buttons[i].setAttribute("aria-selected", String(selected));
            buttons[i].setAttribute("tabindex", selected ? "0" : "-1");
          }
        }

        function renderVisibleGroups() {
          var results = document.getElementById("results");
          var visible = _allResults.slice(0, _shownCount);
          var showColumns = storiesInScope();
          results.classList.toggle("two-column", showColumns);
          if (!showColumns) {
            results.removeAttribute("data-active-tab");
            hideMobileTabs();
            results.innerHTML = renderGroups(visible);
            return;
          }
          var discourseGroups = [];
          var storyGroups = [];
          for (var i = 0; i < visible.length; i++) {
            if (visible[i].source === "stories") storyGroups.push(visible[i]);
            else discourseGroups.push(visible[i]);
          }
          var activeTab = chooseMobileTab(discourseGroups, storyGroups);
          results.setAttribute("data-active-tab", activeTab);
          renderMobileTabs(activeTab);
          results.innerHTML =
            renderColumn("Discourses", "discourses", discourseGroups) +
            renderColumn("Baba stories", "stories", storyGroups);
        }

        function updateShowMore() {
          var old = document.getElementById("show-more-btn");
          if (old) old.parentNode.removeChild(old);
          var remaining = _allResults.length - _shownCount;
          if (remaining <= 0) return;
          var btn = document.createElement("button");
          btn.id = "show-more-btn";
          var nextBatch = Math.min(remaining, PAGE_SIZE);
          btn.textContent =
            "Show " +
            nextBatch +
            " more" +
            (remaining > PAGE_SIZE ? " (" + remaining + " remaining)" : "");
          btn.onclick = function () {
            var next = _allResults.slice(_shownCount, _shownCount + PAGE_SIZE);
            _shownCount += next.length;
            renderVisibleGroups();
            updateShowMore();
            updateStatus();
          };
          document.getElementById("results").appendChild(btn);
        }

        function updateStatus() {
          var totalCount = 0;
          for (var i = 0; i < _allResults.length; i++)
            totalCount += _allResults[i].count;
          var showing =
            _shownCount < _allResults.length
              ? "Showing " + _shownCount + " of " + _allResults.length
              : String(_allResults.length);
          document.getElementById("status").textContent =
            showing +
            " document" +
            (_allResults.length !== 1 ? "s" : "") +
            ", " +
            totalCount +
            " occurrence" +
            (totalCount !== 1 ? "s" : "");
        }

        function renderResults(allGroups) {
          var re = document.getElementById("results"),
            st = document.getElementById("status"),
            hero = document.getElementById("hero");
          if (!allGroups.length) {
            _allResults = [];
            _shownCount = 0;
            re.classList.remove("two-column");
            re.removeAttribute("data-active-tab");
            hideMobileTabs();
            re.innerHTML = "";
            st.textContent = "No results found.";
            hero.classList.add("has-results");
            return;
          }
          _allResults = allGroups;
          _shownCount = Math.min(PAGE_SIZE, allGroups.length);
          renderVisibleGroups();
          updateShowMore();
          updateStatus();
          hero.classList.add("has-results");
        }
        var timer = null;
        function onInput() {
          clearTimeout(timer);
          var q = document.getElementById("search-input").value;
          if (normalize(q.trim()).length < MIN_QUERY) {
            document.getElementById("results").innerHTML = "";
            document.getElementById("results").classList.remove("two-column");
            document.getElementById("results").removeAttribute("data-active-tab");
            hideMobileTabs();
            document.getElementById("status").textContent = "";
            document.getElementById("hero").classList.remove("has-results");
            return;
          }
          timer = setTimeout(function () {
            var all = search(q);
            renderResults(all);
          }, DEBOUNCE_MS);
        }
        function pickRandom() {
          if (typeof searchIndex === "undefined") return;
          var seen = Object.create(null);
          var pool = [];
          for (var i = 0; i < searchIndex.length; i++) {
            var entry = searchIndex[i];
            if (!inScope(entry) || seen[entry.f]) continue;
            seen[entry.f] = true;
            pool.push(entry.f);
          }
          if (!pool.length) return;
          // Persist pool so the parent frame can offer a "next random" button
          try {
            sessionStorage.setItem("ee7-random-pool", JSON.stringify(pool));
          } catch (e) {}
          var pick = pool[Math.floor(Math.random() * pool.length)];
          if (window.parent !== window) {
            window.parent.postMessage(
              { type: "ee7-navigate", href: pick, isRandom: true },
              "*",
            );
          } else {
            window.location.href = pick;
          }
        }

        // Intercept result link clicks for animated navigation
        document.addEventListener("click", function (e) {
          var link = e.target.closest("#results a[href]");
          if (!link) return;
          if (window.parent === window) return;
          e.preventDefault();
          window.parent.postMessage(
            { type: "ee7-navigate", href: link.href },
            "*",
          );
        });

        document
          .getElementById("results")
          .addEventListener("click", function (e) {
            var btn = e.target.closest(".ee7-favorite-toggle");
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            if (!window.EE7Favorites) return;
            window.EE7Favorites.toggleFavorite({
              href: btn.getAttribute("data-ee7-favorite-href"),
              title: btn.getAttribute("data-ee7-favorite-title"),
            });
            window.EE7Favorites.syncFavoriteButtons(
              document.getElementById("results"),
            );
          });

        document
          .getElementById("mobile-result-tabs")
          .addEventListener("click", function (e) {
            var tab = e.target.closest(".mobile-result-tab");
            if (!tab) return;
            setMobileTab(tab.getAttribute("data-source"));
          });

        document
          .getElementById("mobile-result-tabs")
          .addEventListener("keydown", function (e) {
            var tab = e.target.closest(".mobile-result-tab");
            if (!tab) return;
            var buttons = Array.prototype.slice.call(
              document.querySelectorAll(".mobile-result-tab"),
            );
            var index = buttons.indexOf(tab);
            var nextIndex = index;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") {
              nextIndex = (index + 1) % buttons.length;
            } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
              nextIndex = (index - 1 + buttons.length) % buttons.length;
            } else if (e.key === "Home") {
              nextIndex = 0;
            } else if (e.key === "End") {
              nextIndex = buttons.length - 1;
            } else {
              return;
            }
            e.preventDefault();
            var next = buttons[nextIndex];
            next.focus();
            setMobileTab(next.getAttribute("data-source"));
          });

        window.addEventListener("load", function () {
          initCorpusToggle();
          buildFilterBar();
          var inp = document.getElementById("search-input");
          inp.addEventListener("input", onInput);
          inp.focus();
          document
            .getElementById("random-btn")
            .addEventListener("click", pickRandom);
          if (typeof searchIndex === "undefined")
            document.getElementById("status").textContent =
              "Search index not found. Run build_search_index.py first.";
        });
      })();
    </script>
  </body>
</html>
