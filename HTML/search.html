<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search — EE 7+</title>
    <script src="search_index.js"></script>
    <script src="filter_sets.js"></script>
    <script src="Layout/favorites.js"></script>
    <style>
      :root[data-theme="dark"] {
        --bg: #2e2a24;
        --text: #ddd5c8;
        --text-dim: #8c8078;
        --text-mid: #a09088;
        --accent: #e07820;
        --accent-dim: rgba(224, 120, 32, 0.18);
        --border: #3e3228;
        --mark-bg: rgba(224, 120, 32, 0.28);
        --input-bg: #352f28;
        --input-border: #4a3c30;
        --input-focus: #e07820;
      }
      :root[data-theme="light"] {
        --bg: #f7f4f0;
        --text: #1a160e;
        --text-dim: #9a8e80;
        --text-mid: #6a6050;
        --accent: #c06010;
        --accent-dim: rgba(192, 96, 16, 0.1);
        --border: #d5cfc6;
        --mark-bg: rgba(192, 96, 16, 0.22);
        --input-bg: #ffffff;
        --input-border: #c8c0b4;
        --input-focus: #c06010;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, "Arial Unicode MS", Geneva, sans-serif;
        font-size: 10pt;
        line-height: 1.5;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      #page {
        min-height: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 0 24px 60px;
      }

      /* Hero — collapses once results appear */
      #hero {
        padding: 60px 0 28px;
        text-align: center;
        transition: padding 0.25s;
      }
      #hero.has-results {
        padding: 22px 0 16px;
      }

      #hero-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 26px;
      }
      #hero.has-results #hero-header {
        display: none;
      }

      #hero-photo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        object-position: top center;
        border: 2px solid var(--border);
        flex-shrink: 0;
        opacity: 0.88;
      }

      #hero-title {
        font-size: 15pt;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text);
        margin-bottom: 4px;
      }
      #hero-sub {
        font-size: 8.5pt;
        color: var(--text-dim);
        margin-bottom: 0;
      }
      /* hero-header (title + photo) hides when results appear */

      /* Search input */
      #search-wrap {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #search-input-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #search-input {
        width: 100%;
        background: var(--input-bg);
        border: 1.5px solid var(--input-border);
        border-radius: 28px;
        padding: 13px 46px 13px 20px;
        font-family: inherit;
        font-size: 11.5pt;
        color: var(--text);
        outline: none;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
        -webkit-appearance: none;
      }
      #search-input::placeholder {
        color: var(--text-dim);
      }
      #search-input:focus {
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }
      #search-input:disabled {
        border-color: var(--border);
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.7;
      }
      #search-input::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }
      #search-icon {
        position: absolute;
        right: 17px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        pointer-events: none;
      }

      /* ── Random discourse button ───────────────────────── */
      #random-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: none;
        color: var(--text-dim);
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
        padding: 0;
      }
      #random-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }
      #random-btn:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      #random-btn:disabled:hover {
        border-color: var(--border);
        color: var(--text-dim);
        background: none;
      }
      #search-hint {
        margin-top: 9px;
        font-size: 7.5pt;
        color: var(--text-dim);
        text-align: center;
      }
      #search-mode-note {
        margin: 5px 0 0;
        padding: 9px 12px;
        border-left: 2px solid var(--accent);
        background: var(--accent-dim);
        color: var(--text-mid);
        font-size: 8.5pt;
        line-height: 1.45;
      }

      /* Status */
      #status {
        font-size: 8pt;
        color: var(--text-dim);
        padding: 8px 0 2px;
        min-height: 20px;
      }

      /* Results */
      #results.multi-column {
        display: block;
      }
      .result-column {
        min-width: 0;
      }
      .result-column-title {
        margin: 20px 0 0;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 10pt;
        line-height: 1.3;
      }
      .result-column-count {
        color: var(--text-dim);
        font-size: 8pt;
        font-weight: 400;
      }
      .result-column-empty {
        margin: 22px 0 0;
        color: var(--text-dim);
        font-size: 8.5pt;
        font-style: italic;
      }
      /* Result tabs */
      #mobile-result-tabs {
        display: none;
      }
      #mobile-result-tabs.visible {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 0;
        margin-top: 16px;
        border-bottom: 1px solid var(--border);
      }
      .mobile-result-tab {
        min-width: 0;
        padding: 9px 8px 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 8.5pt;
        line-height: 1.3;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .mobile-result-tab:hover {
        color: var(--accent);
      }
      .mobile-result-tab[aria-selected="true"] {
        border-bottom-color: var(--accent);
        color: var(--accent);
        font-weight: 700;
      }
      .mobile-result-tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .mobile-result-tab-count {
        color: var(--text-dim);
        font-size: 7.5pt;
        font-weight: 400;
      }
      #results.multi-column[data-active-tab] .result-column {
        display: none;
      }
      #results.multi-column[data-active-tab="discourses"]
        .result-column-discourses,
      #results.multi-column[data-active-tab="stories"]
        .result-column-stories,
      #results.multi-column[data-active-tab="other_spiritual_books"]
        .result-column-other_spiritual_books,
      #results.multi-column[data-active-tab="acharya_philosophy"]
        .result-column-acharya_philosophy {
        display: block;
      }
      .result-group {
        margin-top: 22px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }
      .result-group:last-child {
        border-bottom: none;
      }
      .result-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10.5pt;
        font-weight: 700;
        margin-bottom: 5px;
        line-height: 1.3;
      }
      .result-title-link {
        min-width: 0;
        flex: 1;
      }
      .result-title a {
        color: var(--accent);
      }
      .result-title a:hover {
        color: var(--text);
        text-decoration: none;
      }
      .result-count {
        font-size: 8pt;
        color: var(--text-dim);
        font-weight: 400;
        margin-left: 2px;
        flex-shrink: 0;
      }
      .result-source {
        font-size: 7.5pt;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 2px 7px;
        font-weight: 400;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .result-snippet {
        font-size: 8.5pt;
        color: var(--text-mid);
        line-height: 1.6;
        margin: 4px 0 2px;
      }
      .result-anchor {
        display: inline-block;
        font-size: 7.5pt;
        color: var(--text-dim);
        background: var(--accent-dim);
        border-radius: 3px;
        padding: 1px 5px;
        margin-right: 6px;
        text-decoration: none;
        transition:
          background 0.14s,
          color 0.14s;
      }
      .result-anchor:hover {
        background: var(--accent);
        color: #fff;
      }
      .result-title mark,
      .result-snippet mark {
        background: var(--mark-bg);
        color: var(--text);
        border-radius: 2px;
        padding: 0 2px;
        font-weight: 600;
      }
      #show-more-btn {
        display: block;
        margin: 24px auto 0;
        padding: 9px 28px;
        background: none;
        border: 1.5px solid var(--border);
        border-radius: 20px;
        color: var(--text-mid);
        font-family: inherit;
        font-size: 8.5pt;
        cursor: pointer;
        transition:
          border-color 0.16s,
          color 0.16s,
          background 0.16s;
      }
      #show-more-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }

      /* Corpus source picker */
      #corpus-picker {
        position: relative;
        display: inline-block;
        margin-top: 12px;
      }
      #corpus-picker-toggle {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-width: 224px;
        padding: 7px 11px 7px 13px;
        border: 1px solid var(--input-border);
        border-radius: 5px;
        background: var(--input-bg);
        color: var(--text-mid);
        font-family: inherit;
        font-size: 8.5pt;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
      }
      #corpus-picker-toggle:hover,
      #corpus-picker-toggle[aria-expanded="true"] {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }
      #corpus-picker-toggle:focus-visible,
      .corpus-option:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .corpus-picker-title {
        color: var(--text);
        font-weight: 700;
      }
      #corpus-picker-summary {
        flex: 1;
        color: var(--text-dim);
        text-align: right;
      }
      #corpus-picker-chevron {
        transition: transform 0.15s;
      }
      #corpus-picker-toggle[aria-expanded="true"] #corpus-picker-chevron {
        transform: rotate(180deg);
      }
      #corpus-picker-menu {
        position: absolute;
        z-index: 5;
        top: calc(100% + 8px);
        left: 50%;
        width: min(320px, calc(100vw - 48px));
        padding: 8px;
        border: 1px solid var(--input-border);
        border-radius: 7px;
        background: var(--input-bg);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
        transform: translateX(-50%);
      }
      #corpus-picker-menu[hidden] {
        display: none;
      }
      .corpus-option {
        display: inline-flex;
        align-items: center;
        width: 100%;
        gap: 9px;
        padding: 9px 8px;
        color: var(--text-mid);
        font-size: 8.5pt;
        cursor: pointer;
        user-select: none;
        text-align: left;
        transition: background 0.15s, color 0.15s;
      }
      .corpus-option:hover {
        border-radius: 4px;
        background: var(--accent-dim);
        color: var(--text);
      }
      .corpus-option input {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--accent);
      }
      .corpus-option.disabled {
        opacity: 0.55;
        cursor: default;
      }
      .corpus-option.disabled:hover {
        background: none;
        color: var(--text-mid);
      }
      .corpus-picker-note {
        padding: 7px 8px 4px;
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 7.5pt;
        line-height: 1.4;
      }

      /* ── Filter chips ──────────────────────────────────────── */
      #filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-top: 12px;
      }
      #filter-bar.hidden {
        display: none;
      }
      .filter-chip {
        padding: 4px 14px;
        border-radius: 14px;
        border: 1.5px solid var(--border);
        background: none;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 8pt;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
        white-space: nowrap;
      }
      .filter-chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .filter-chip.active {
        border-color: var(--accent);
        background: var(--accent-dim);
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="hero">
        <div id="hero-header">
          <div>
            <p id="hero-title">Works of P.R. Sarkar</p>
            <p id="hero-sub">
              Full-text search across 1,600+ discourses and a wider spiritual library
            </p>
          </div>
          <img id="hero-photo" src="Images/Sarkar.jpg" alt="P.R. Sarkar" />
        </div>
        <div id="search-wrap">
          <div id="search-input-wrap">
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Search discourses…"
              aria-label="Search discourses"
              aria-describedby="search-hint"
            />
            <svg
              id="search-icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="6.5" cy="6.5" r="4.5" />
              <line x1="10" y1="10" x2="14" y2="14" />
            </svg>
          </div>
          <button
            id="random-btn"
            type="button"
            aria-label="Open a random selected source"
            aria-describedby="search-hint"
            title="Random selected source"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="1" y="1" width="14" height="14" rx="3" />
              <circle cx="5" cy="5" r="1" fill="currentColor" stroke="none" />
              <circle cx="11" cy="5" r="1" fill="currentColor" stroke="none" />
              <circle cx="5" cy="11" r="1" fill="currentColor" stroke="none" />
              <circle cx="11" cy="11" r="1" fill="currentColor" stroke="none" />
              <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>
        <p id="search-hint" aria-live="polite">
          <span id="search-hint-default">
            Type at least 3 characters &nbsp;·&nbsp; diacritics ignored:
            <em>siva</em> finds <em>Śiva</em>
          </span>
          <span id="search-hint-disabled" hidden>
            Select at least one source in Search sources to enable search.
          </span>
        </p>
        <div id="corpus-picker">
          <button
            id="corpus-picker-toggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="corpus-picker-menu"
          >
            <span class="corpus-picker-title">Search sources</span>
            <span id="corpus-picker-summary">Discourses only</span>
            <svg
              id="corpus-picker-chevron"
              width="12"
              height="12"
              viewBox="0 0 12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m2.5 4.5 3.5 3.5 3.5-3.5" />
            </svg>
          </button>
          <div
            id="corpus-picker-menu"
            role="group"
            aria-label="Search sources"
            hidden
          >
            <label class="corpus-option" data-corpus-option="discourses">
              <input
                type="checkbox"
                data-corpus-source="discourses"
                checked
              />
              <span>Discourses</span>
            </label>
            <label class="corpus-option" data-corpus-option="stories">
              <input type="checkbox" data-corpus-source="stories" />
              <span>Baba Stories</span>
            </label>
            <label
              class="corpus-option"
              data-corpus-option="other_spiritual_books"
            >
              <input type="checkbox" data-corpus-source="other_spiritual_books" />
              <span>Other Spiritual Books</span>
            </label>
            <label
              class="corpus-option"
              data-corpus-option="acharya_philosophy"
            >
              <input type="checkbox" data-corpus-source="acharya_philosophy" />
              <span>Acharya Philosophy</span>
            </label>
            <p class="corpus-picker-note">
              Choose any combination of sources. Only Discourses starts selected.
            </p>
          </div>
        </div>
        <div id="filter-bar" class="hidden" aria-label="Filter by set"></div>
      </div>

      <div id="status"></div>
      <div id="search-mode-note" aria-live="polite" hidden></div>
      <div
        id="mobile-result-tabs"
        role="tablist"
        aria-label="Search result category"
        aria-hidden="true"
      ></div>
      <div id="results"></div>
    </div>

    <script>
      (function () {
        "use strict";

        var THEME_KEY = "ee7-theme";

        function applyTheme(t) {
          document.documentElement.setAttribute("data-theme", t);
        }
        // init from localStorage
        (function () {
          var t = "dark";
          try {
            t = localStorage.getItem(THEME_KEY) || "dark";
          } catch (e) {}
          applyTheme(t);
        })();
        // listen for parent messages
        window.addEventListener("message", function (e) {
          if (e.data && e.data.type === "ee7-theme") applyTheme(e.data.theme);
        });

        var MAX_GROUPS = 30,
          PAGE_SIZE = 30,
          MAX_SNIPPETS = 3,
          CONTEXT_LEN = 100,
          DEBOUNCE_MS = 200,
          MIN_QUERY = 3,
          FUZZY_MIN_TERM_LENGTH = 4,
          FUZZY_MAX_DISTANCE = 2,
          FUZZY_MAX_RESULTS = 30;

        // State for incremental loading
        var _allResults = [],
          _shownCount = 0,
          _isFuzzySearch = false;

        var SOURCE_DEFINITIONS = {
          discourses: { label: "Discourses", resultLabel: "Discourse" },
          stories: { label: "Baba Stories", resultLabel: "Baba story" },
          other_spiritual_books: {
            label: "Other Spiritual Books",
            resultLabel: "Other spiritual book",
          },
          acharya_philosophy: {
            label: "Acharya Philosophy",
            resultLabel: "Acharya philosophy",
          },
        };
        var SOURCE_ORDER = [
          "discourses",
          "stories",
          "other_spiritual_books",
          "acharya_philosophy",
        ];

        // Filter state. A custom filter set applies to discourse files and
        // intentionally narrows the scope to those files.
        var _activeFilter = null;
        var _activeFilterName = null;
        var FILTER_KEY = "ee7-active-filter";
        var _selectedSources = { discourses: true };
        var SOURCES_KEY = "ee7-corpus-sources";
        var SOURCES_VERSION_KEY = "ee7-corpus-sources-version";
        var LEGACY_STORIES_KEY = "ee7-include-stories";
        var _activeMobileTab = null;

        function buildFilterBar() {
          var bar = document.getElementById("filter-bar");
          if (typeof filterSets === "undefined") return;
          var keys = Object.keys(filterSets);
          // Only show the bar if there's more than just "All"
          if (keys.length <= 1) return;
          bar.classList.remove("hidden");
          // Restore saved filter from localStorage, fall back to first key
          var savedName = null;
          try {
            savedName = localStorage.getItem(FILTER_KEY);
          } catch (e) {}
          if (
            !savedName ||
            !Object.prototype.hasOwnProperty.call(filterSets, savedName)
          ) {
            savedName = keys[0];
          }
          _activeFilterName = savedName;
          _activeFilter = makeFilterLookup(filterSets[savedName]);
          keys.forEach(function (name) {
            var btn = document.createElement("button");
            btn.className =
              "filter-chip" + (name === _activeFilterName ? " active" : "");
            btn.textContent = name;
            btn.onclick = function () {
              _activeFilterName = name;
              _activeFilter = makeFilterLookup(filterSets[name]);
              try {
                localStorage.setItem(FILTER_KEY, name);
              } catch (e) {}
              bar.querySelectorAll(".filter-chip").forEach(function (c) {
                c.classList.toggle("active", c.textContent === name);
              });
              rerunCurrentSearch();
            };
            bar.appendChild(btn);
          });
        }

        function makeFilterLookup(list) {
          if (!list) return null; // null = all
          var obj = Object.create(null);
          for (var i = 0; i < list.length; i++) obj[list[i]] = true;
          return obj;
        }

        function sourceOf(entry) {
          if (
            entry &&
            Object.prototype.hasOwnProperty.call(SOURCE_DEFINITIONS, entry.s)
          ) {
            return entry.s;
          }
          return "discourses";
        }

        function availableSources() {
          var available = [];
          if (typeof searchIndex === "undefined") return available;
          for (var i = 0; i < SOURCE_ORDER.length; i++) {
            var source = SOURCE_ORDER[i];
            for (var j = 0; j < searchIndex.length; j++) {
              if (sourceOf(searchIndex[j]) === source) {
                available.push(source);
                break;
              }
            }
          }
          return available;
        }

        function selectedSources() {

              sources.push(SOURCE_ORDER[i]);
            }
          }
          return sources;
        }

          var base = filePath.split("/").pop();
          return !!_activeFilter[base];
        }

        function inScope(entry) {
          var source = sourceOf(entry);
          if (!_selectedSources[source]) return false;
          return inFilter(entry.f, entry);
        }

        function persistSelectedSources() {
          var sources = [];
          for (var i = 0; i < SOURCE_ORDER.length; i++) {
            if (_selectedSources[SOURCE_ORDER[i]]) {
              sources.push(SOURCE_ORDER[i]);
            }
          }
          try {
            localStorage.setItem(SOURCES_KEY, JSON.stringify(sources));
            localStorage.setItem(SOURCES_VERSION_KEY, "2");
          } catch (e) {}
        }

        function updateCorpusPicker() {
          var summary = document.getElementById("corpus-picker-summary");
          var searchInput = document.getElementById("search-input");
          var randomButton = document.getElementById("random-btn");
          var defaultHint = document.getElementById("search-hint-default");
          var disabledHint = document.getElementById("search-hint-disabled");
          var sources = selectedSources();
          var noSources = sources.length === 0;
          if (!sources.length) {
            summary.textContent = "No sources selected";
          } else if (sources.length === 1) {
            summary.textContent =
              SOURCE_DEFINITIONS[sources[0]].label + " only";
          } else if (sources.length === 2) {
            summary.textContent =
              SOURCE_DEFINITIONS[sources[0]].label +
              " + " +
              SOURCE_DEFINITIONS[sources[1]].label;
          } else {
            summary.textContent = sources.length + " sources selected";
          }
          searchInput.placeholder =
            noSources
              ? "Select a source to enable search…"
              : sources.length === 1
                ? "Search " +
                  SOURCE_DEFINITIONS[sources[0]].label.toLowerCase() +
                  "…"
                : "Search selected sources…";
          searchInput.setAttribute(
            "aria-label",
            noSources
              ? "Search disabled until a source is selected"
              : sources.length === 1
                ? "Search " + SOURCE_DEFINITIONS[sources[0]].label
                : "Search selected corpus sources",
          );
          searchInput.disabled = noSources;
          searchInput.setAttribute("aria-disabled", String(noSources));
          randomButton.disabled = noSources;
          randomButton.setAttribute(
            "aria-label",
            noSources
              ? "Random source disabled until a source is selected"
              : "Open a random selected source",
          );
          randomButton.setAttribute(
            "title",
            noSources
              ? "Select at least one source to enable random selection"
              : "Random selected source",
          );
          defaultHint.hidden = noSources;
          disabledHint.hidden = !noSources;
          var inputs = document.querySelectorAll("[data-corpus-source]");
          for (var i = 0; i < inputs.length; i++) {
            var input = inputs[i];
            var source = input.getAttribute("data-corpus-source");
            input.checked = !!_selectedSources[source];
          }
        }

        function initCorpusPicker() {
          var available = availableSources();
          var hasSavedSources = false;
          var savedSources = null;
          try {
            var saved = localStorage.getItem(SOURCES_KEY);
            if (saved !== null) {
              savedSources = JSON.parse(saved);
              if (Array.isArray(savedSources)) {
                hasSavedSources = true;
                if (localStorage.getItem(SOURCES_VERSION_KEY) !== "2") {
                  savedSources = ["discourses"].concat(savedSources);
                }
              }
            }
          } catch (e) {}
          if (!hasSavedSources) {
            try {
              if (localStorage.getItem(LEGACY_STORIES_KEY) === "true") {
                savedSources = ["discourses", "stories"];
                hasSavedSources = true;
              }
            } catch (e) {}
          }
          if (!hasSavedSources) savedSources = ["discourses"];
          _selectedSources = {};
          for (var i = 0; i < SOURCE_ORDER.length; i++) {
            var source = SOURCE_ORDER[i];
            _selectedSources[source] =
              available.indexOf(source) !== -1 &&
              savedSources.indexOf(source) !== -1;
          }

          var inputs = document.querySelectorAll("[data-corpus-source]");
          for (var j = 0; j < inputs.length; j++) {
            var input = inputs[j];
            var source = input.getAttribute("data-corpus-source");
            var option = input.closest("[data-corpus-option]");
            var isAvailable = available.indexOf(source) !== -1;
            input.disabled = !isAvailable;
            if (option) option.classList.toggle("disabled", !isAvailable);
            input.addEventListener("change", function () {
              var changedSource = this.getAttribute("data-corpus-source");
              _selectedSources[changedSource] = this.checked;
              persistSelectedSources();
              updateCorpusPicker();
              rerunCurrentSearch();
            });
          }
          updateCorpusPicker();

          var picker = document.getElementById("corpus-picker");
          var toggle = document.getElementById("corpus-picker-toggle");
          var menu = document.getElementById("corpus-picker-menu");
          function closePicker() {
            toggle.setAttribute("aria-expanded", "false");
            menu.hidden = true;
          }
          toggle.addEventListener("click", function () {
            var expanded = toggle.getAttribute("aria-expanded") === "true";
            toggle.setAttribute("aria-expanded", String(!expanded));
            menu.hidden = expanded;
          });
          document.addEventListener("click", function (event) {
            if (!picker.contains(event.target)) closePicker();
          });
          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
              closePicker();
              toggle.focus();
            }
          });

        function rerunCurrentSearch() {

        function normalize(s) {
          return s
            .normalize("NFD")
            .replace(/[\u0300-\u036f\u1dc0-\u1dff\u20d0-\u20ff]/g, "")
            .toLowerCase();

        function findAll(hay, needle) {
          var out = [],
            pos = 0,
            i;
          while ((i = hay.indexOf(needle, pos)) !== -1) {
            out.push(i);

          }
          return out;

        function wordTokens(normalizedText) {
          var tokens = [],
            pattern = /[\p{L}\p{N}]+/gu,
            match;

            tokens.push({ value: match[0], index: match.index });
          }
          return tokens;
        }
        function fuzzyDistance(term, candidate, maxDistance) {
          if (Math.abs(term.length - candidate.length) > maxDistance) {
            return maxDistance + 1;
          }
          var shorter = term,
            longer = candidate;
          if (shorter.length > longer.length) {
            shorter = candidate;
            longer = term;
          }
          var previous = new Array(shorter.length + 1);
          for (var j = 0; j <= shorter.length; j++) previous[j] = j;
          for (var i = 1; i <= longer.length; i++) {
            var current = new Array(shorter.length + 1);
            current[0] = i;
            for (var k = 1; k <= shorter.length; k++) {
              var cost = longer.charAt(i - 1) === shorter.charAt(k - 1) ? 0 : 1;
              current[k] = Math.min(
                previous[k] + 1,
                current[k - 1] + 1,
                previous[k - 1] + cost,
              );
            }
            previous = current;
          }
          return previous[shorter.length];
        }
        function findBestFuzzyToken(tokens, term, maxDistance) {
          var best = null;
          for (var i = 0; i < tokens.length; i++) {
            var token = tokens[i];
            if (Math.abs(term.length - token.value.length) > maxDistance) {
              continue;
            }
            var distance = fuzzyDistance(term, token.value, maxDistance);
            if (
              distance <= maxDistance &&
              (!best ||
                distance < best.distance ||
                (distance === best.distance &&
                  Math.abs(term.length - token.value.length) <
                    Math.abs(term.length - best.value.length)))
            ) {
              best = {
                value: token.value,
                index: token.index,
                distance: distance,
              };

            }

        }
        function escHtml(s) {

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")

        function makeSnippet(orig, normX, pos, qlen) {
          var s = Math.max(0, pos - CONTEXT_LEN),
            e = Math.min(orig.length, pos + qlen + CONTEXT_LEN);
          return (
            (s > 0 ? "[…] " : "") +
            escHtml(orig.slice(s, pos)) +
            "<mark>" +
            escHtml(orig.slice(pos, pos + qlen)) +
            "</mark>" +
            escHtml(orig.slice(pos + qlen, e)) +
            (e < orig.length ? " […]" : "")
          );
        }
        function highlightMatches(orig, positions, qlen) {
          var html = "",
            last = 0;

            var pos = positions[i];

            html += escHtml(orig.slice(last, pos));
            html +=
              "<mark>" +
              escHtml(orig.slice(pos, pos + qlen)) +
              "</mark>";
            last = pos + qlen;

        function search(rawQuery) {

          if (normQ.length < MIN_QUERY) return [];
          if (typeof searchIndex === "undefined") return [];
          var map = Object.create(null),
            order = [];
          for (var i = 0; i < searchIndex.length; i++) {
            var entry = searchIndex[i];
            if (!inScope(entry)) continue;
            var normTitle = normalize(entry.t),
              titlePos = findAll(normTitle, normQ),
              normX = normalize(entry.x),
              pos = findAll(normX, normQ);
            if (!titlePos.length && !pos.length) continue;
            if (!map[entry.f]) {
              map[entry.f] = {
                t: entry.t,
                titleHtml: escHtml(entry.t),
                f: entry.f,
                source: sourceOf(entry),
                count: 0,
                titleMatched: false,
                snippets: [],
              };
              order.push(entry.f);
            }
            var g = map[entry.f];
            // The title is repeated on every paragraph entry, so count a
            // title match once per discourse rather than once per paragraph.
            if (titlePos.length && !g.titleMatched) {
              g.titleMatched = true;
              g.count += titlePos.length;
              g.titleHtml = highlightMatches(entry.t, titlePos, normQ.length);
            }
            g.count += pos.length;
            if (g.snippets.length < MAX_SNIPPETS && pos.length) {
              g.snippets.push({
                a: entry.a,
                html: makeSnippet(entry.x, normX, pos[0], normQ.length),
              });
            }
          }
          return order
            .map(function (k, index) {
              var group = map[k];
              group.order = index;
              return group;
            })
            .sort(function (a, b) {
              return b.count - a.count || a.order - b.order;
            });

        function fuzzySearch(rawQuery) {

          if (!queryTokens.length) return [];

          var map = Object.create(null),
            order = 0;
          for (var i = 0; i < searchIndex.length; i++) {
            var entry = searchIndex[i];
            if (!inScope(entry)) continue;
            var normTitle = normalize(entry.t),
              titleTokens = wordTokens(normTitle),
              normX = normalize(entry.x),
              bodyTokens = wordTokens(normX),
              score = 0,
              allMatched = true,
              titleMatches = [],

            for (var q = 0; q < queryTokens.length; q++) {
              var term = queryTokens[q].value;
              var maxDistance = Math.min(
                FUZZY_MAX_DISTANCE,
                Math.max(1, Math.floor(term.length / 4)),

              var titleMatch = findBestFuzzyToken(
                titleTokens,
                term,
                maxDistance,
              );
              var bodyMatch = findBestFuzzyToken(
                bodyTokens,
                term,
                maxDistance,
              );
              if (!titleMatch && !bodyMatch) {
                allMatched = false;
                break;
              }
              var chosenMatch =
                titleMatch &&
                (!bodyMatch || titleMatch.distance <= bodyMatch.distance)
                  ? titleMatch
                  : bodyMatch;
              score += chosenMatch.distance / maxDistance;
              score += chosenMatch === titleMatch ? -0.35 : 0.1;
              if (titleMatch) titleMatches.push(titleMatch);
              if (bodyMatch) bodyMatches.push(bodyMatch);
            }
            if (!allMatched) continue;

            var group = map[entry.f];
            if (!group) {
              group = map[entry.f] = {
                t: entry.t,
                titleHtml: escHtml(entry.t),
                f: entry.f,
                source: sourceOf(entry),
                count: 1,
                fuzzy: true,
                fuzzyScore: Infinity,
                order: order++,
                snippets: [],
              };
            }
            if (score >= group.fuzzyScore) continue;
            group.fuzzyScore = score;

            var bestTitleMatch = null;
            for (var titleIndex = 0; titleIndex < titleMatches.length; titleIndex++) {
              if (
                !bestTitleMatch ||
                titleMatches[titleIndex].distance < bestTitleMatch.distance
              ) {
                bestTitleMatch = titleMatches[titleIndex];
              }
            }
            group.titleHtml = bestTitleMatch
              ? highlightMatches(
                  entry.t,
                  [bestTitleMatch.index],
                  bestTitleMatch.value.length,
                )
              : escHtml(entry.t);

            group.snippets = [];
            for (var bodyIndex = 0; bodyIndex < bodyMatches.length; bodyIndex++) {
              var bodyMatch = bodyMatches[bodyIndex];
              var duplicate = false;
              for (var seenIndex = 0; seenIndex < group.snippets.length; seenIndex++) {
                if (group.snippets[seenIndex].a === entry.a) {
                  duplicate = true;
                  break;
                }
              }
              if (duplicate) continue;
              group.snippets.push({
                a: entry.a,
                html: makeSnippet(
                  entry.x,
                  normX,
                  bodyMatch.index,
                  bodyMatch.value.length,
                ),
              });
              if (group.snippets.length >= MAX_SNIPPETS) break;
            }
          }
          return Object.keys(map)
            .map(function (key) {
              return map[key];
            })
            .sort(function (a, b) {
              return a.fuzzyScore - b.fuzzyScore || a.order - b.order;
            })
            .slice(0, FUZZY_MAX_RESULTS);
        }

        function searchWithFallback(rawQuery) {
          var exactResults = search(rawQuery);
          if (exactResults.length) {
            return { groups: exactResults, fuzzy: false };
          }
          var fuzzyResults = fuzzySearch(rawQuery);
          return {
            groups: fuzzyResults,
            fuzzy: true,
            query: rawQuery.trim(),
          };
        }

        function renderGroup(group) {
          var html = '<div class="result-group">';
          html +=
            '<div class="result-title"><a class="result-title-link" href="' +
            escHtml(group.f) +
            '" target="Client">' +
            group.titleHtml +
            "</a>" +
            (window.EE7Favorites
              ? window.EE7Favorites.favoriteButtonHtml(
                  { href: group.f, title: group.t },
                  { compact: true },
                )
              : "");
          html +=
            '<span class="result-source">' +
            SOURCE_DEFINITIONS[group.source].resultLabel +
            "</span>";
          html += group.fuzzy
            ? '<span class="result-count">(approximate match)</span></div>'
            : '<span class="result-count">(' +
              group.count +
              " occurrence" +
              (group.count !== 1 ? "s" : "") +
              ")</span></div>";

            var snippet = group.snippets[s];
            html +=
              '<div class="result-snippet"><a class="result-anchor" href="' +
              escHtml(group.f) +
              "#" +
              escHtml(snippet.a) +
              '" target="Client">' +
              escHtml(snippet.a) +
              "</a>" +
              snippet.html +
              "</div>";

        function renderColumn(title, source, groups) {

            source +
            '" aria-labelledby="mobile-tab-' +
            source +

            title +
            ' <span class="result-column-count">(' +
            groups.length +
            ")</span></h2>";
          html += groups.length
            ? renderGroups(groups)
            : '<p class="result-column-empty">No matches.</p>';

        }

        function countResultsBySource(source) {

          return count;
        }

        function mobileTabHtml(source, title, count, activeSource) {

            '<button id="mobile-tab-' +
            source +
            '" class="mobile-result-tab" type="button" role="tab"' +
            ' data-source="' +
            source +
            '" aria-controls="result-column-' +
            source +
            '" aria-selected="' +
            String(selected) +

            ' <span class="mobile-result-tab-count">(' +
            count +
            ")</span></button>"

        function renderMobileTabs(activeSource) {

            .map(function (source) {

                source,
                SOURCE_DEFINITIONS[source].label,
                countResultsBySource(source),
                activeSource,

        function chooseMobileTab(groupsBySource) {

            _activeMobileTab &&
            sources.indexOf(_activeMobileTab) !== -1 &&
            groupsBySource[_activeMobileTab].length
          ) {
            return _activeMobileTab;
          }
          for (var i = 0; i < sources.length; i++) {
            if (groupsBySource[sources[i]].length) return sources[i];
          }

        }

        function setMobileTab(source) {

        function updateShowMore() {

        function updateStatus() {

              showing +
              " approximate document" +
              (_allResults.length !== 1 ? "s" : "");

          var totalCount = 0;
          for (var i = 0; i < _allResults.length; i++)
            totalCount += _allResults[i].count;
          status.textContent =
            showing +
            " document" +
            (_allResults.length !== 1 ? "s" : "") +
            ", " +
            totalCount +
            " occurrence" +
            (totalCount !== 1 ? "s" : "");
        }

        function updateSearchModeNote(isFuzzy, query) {

            note.textContent = "";

          note.hidden = false;
          note.textContent =
            'No exact matches for "' +
            query +
            '". Showing the closest matches instead.';

        function renderResults(allGroups, options) {

            st = document.getElementById("status"),
            hero = document.getElementById("hero");

        var timer = null;
        function onInput() {
          clearTimeout(timer);

          if (normalize(q.trim()).length < MIN_QUERY) {

            document.getElementById("results").classList.remove("multi-column");
            document.getElementById("results").removeAttribute("data-active-tab");

            document.getElementById("status").textContent = "";

            updateSearchModeNote(false);
            document.getElementById("hero").classList.remove("has-results");

        function pickRandom() {

            if (!inScope(entry) || seen[entry.f]) continue;

            pool.push(entry.f);

          // Persist pool so the parent frame can offer a "next random" button
          try {
            sessionStorage.setItem("ee7-random-pool", JSON.stringify(pool));
          } catch (e) {}
          var pick = pool[Math.floor(Math.random() * pool.length)];
          if (window.parent !== window) {
            window.parent.postMessage(
              { type: "ee7-navigate", href: pick, isRandom: true },
              "*",
            );
          } else {
            window.location.href = pick;
          }
        }

        // Intercept result link clicks for animated navigation
        document.addEventListener("click", function (e) {
          var link = e.target.closest("#results a[href]");
          if (!link) return;
          if (window.parent === window) return;
          e.preventDefault();
          window.parent.postMessage(
            { type: "ee7-navigate", href: link.href },
            "*",
          );
        });

        document
          .getElementById("results")
          .addEventListener("click", function (e) {
            var btn = e.target.closest(".ee7-favorite-toggle");
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            if (!window.EE7Favorites) return;
            window.EE7Favorites.toggleFavorite({
              href: btn.getAttribute("data-ee7-favorite-href"),
              title: btn.getAttribute("data-ee7-favorite-title"),
            });
            window.EE7Favorites.syncFavoriteButtons(
              document.getElementById("results"),
            );
          });

        document
          .getElementById("mobile-result-tabs")
          .addEventListener("click", function (e) {
            var tab = e.target.closest(".mobile-result-tab");
            if (!tab) return;
            setMobileTab(tab.getAttribute("data-source"));
          });

        document
          .getElementById("mobile-result-tabs")
          .addEventListener("keydown", function (e) {
            var tab = e.target.closest(".mobile-result-tab");
            if (!tab) return;
            var buttons = Array.prototype.slice.call(
              document.querySelectorAll(".mobile-result-tab"),
            );
            var index = buttons.indexOf(tab);
            var nextIndex = index;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") {
              nextIndex = (index + 1) % buttons.length;
            } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
              nextIndex = (index - 1 + buttons.length) % buttons.length;
            } else if (e.key === "Home") {
              nextIndex = 0;
            } else if (e.key === "End") {
              nextIndex = buttons.length - 1;
            } else {
              return;
            }
            e.preventDefault();
            var next = buttons[nextIndex];
            next.focus();
            setMobileTab(next.getAttribute("data-source"));
          });

        window.addEventListener("load", function () {
          initCorpusPicker();
          buildFilterBar();
          var inp = document.getElementById("search-input");
          inp.addEventListener("input", onInput);
          inp.focus();
          document
            .getElementById("random-btn")
            .addEventListener("click", pickRandom);
          if (typeof searchIndex === "undefined")
            document.getElementById("status").textContent =
              "Search index not found. Run build_search_index.py first.";
        });
      })();
    </script>
  </body>
</html>
