<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Currently reading - EE 7+</title>
    <script src="Layout/theme.js"></script>
    <script src="Layout/reading-state.js"></script>
    <style>
      :root[data-theme="dusk"] {
        --bg: #2e2a24;
        --surface: #352f28;
        --text: #ddd5c8;
        --text-dim: #8c8078;
        --accent: #e07820;
        --accent-dim: rgba(224, 120, 32, 0.18);
        --border: #4a3c30;
      }
      :root[data-theme="light"] {
        --bg: #f7f4f0;
        --surface: #ffffff;
        --text: #1a160e;
        --text-dim: #8f8478;
        --accent: #c06010;
        --accent-dim: rgba(192, 96, 16, 0.1);
        --border: #d5cfc6;
      }
      :root[data-theme="dark"] {
        --bg: #17191b;
        --surface: #222629;
        --text: #f2f3f0;
        --text-dim: #aeb5b8;
        --accent: #ef8b32;
        --accent-dim: rgba(239, 139, 50, 0.16);
        --border: #343a3d;
      }
      :root[data-theme="dawn"] {
        --bg: #d96720;
        --surface: #ed7d2c;
        --text: #fff4e5;
        --text-dim: #ffe0be;
        --accent: #fff7e8;
        --accent-dim: rgba(255, 247, 232, 0.16);
        --border: rgba(82, 28, 6, 0.28);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, "Arial Unicode MS", Geneva, sans-serif;
        font-size: 10pt;
        line-height: 1.5;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      #page {
        max-width: 820px;
        margin: 0 auto;
        padding: 50px 24px 64px;
      }

      #hero {
        align-items: flex-end;
        display: flex;
        gap: 24px;
        justify-content: space-between;
        padding-bottom: 22px;
      }

      .hero-copy {
        min-width: 0;
      }

      #hero-title {
        font-size: 19pt;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-bottom: 5px;
      }

      #hero-sub,
      #status {
        color: var(--text-dim);
        font-size: 8.5pt;
      }

      #status {
        min-height: 18px;
        margin-bottom: 8px;
      }

      .remove-all-button,
      .reading-remove {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        cursor: pointer;
        font: inherit;
        font-size: 8pt;
        line-height: 1;
        padding: 7px 10px;
        white-space: nowrap;
      }

      .remove-all-button:hover,
      .remove-all-button:focus-visible,
      .reading-remove:hover,
      .reading-remove:focus-visible {
        border-color: var(--text-dim);
        color: var(--text);
      }

      #list {
        border-top: 1px solid var(--border);
      }

      .reading-row {
        align-items: center;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 16px;
        padding: 16px 0;
      }

      .reading-main {
        flex: 1;
        min-width: 0;
      }

      .reading-title {
        display: block;
        font-size: 11pt;
        font-weight: 700;
        line-height: 1.35;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reading-meta {
        color: var(--text-dim);
        font-size: 8pt;
        margin-top: 4px;
      }

      .reading-progress {
        align-items: center;
        display: flex;
        flex-shrink: 0;
        gap: 10px;
        min-width: 128px;
      }

      .progress-track {
        background: var(--accent-dim);
        height: 4px;
        overflow: hidden;
        width: 76px;
      }

      .progress-fill {
        background: var(--accent);
        height: 100%;
      }

      .progress-label {
        color: var(--text-dim);
        font-size: 8pt;
        min-width: 38px;
        text-align: right;
      }

      .reading-remove {
        flex-shrink: 0;
      }

      .reading-empty {
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        padding: 24px 0;
      }

      .modal-backdrop {
        align-items: center;
        background: rgba(0, 0, 0, 0.52);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 20px;
        position: fixed;
        z-index: 10;
      }

      .modal-backdrop[hidden] {
        display: none;
      }

      .modal-card {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        max-width: 420px;
        padding: 24px;
        width: 100%;
      }

      .modal-title {
        font-size: 13pt;
        font-weight: 700;
        margin: 0;
      }

      .modal-copy {
        color: var(--text-dim);
        font-size: 9pt;
        line-height: 1.55;
        margin: 10px 0 0;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 22px;
      }

      .modal-button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        cursor: pointer;
        font: inherit;
        font-size: 8.5pt;
        padding: 8px 12px;
      }

      .modal-button:hover,
      .modal-button:focus-visible {
        border-color: var(--text-dim);
        color: var(--text);
      }

      .modal-button--danger {
        background: #5a3830;
        border-color: #75473b;
        color: #fff4e5;
      }

      .modal-button--danger:hover,
      .modal-button--danger:focus-visible {
        background: #704339;
        border-color: #956153;
        color: #fff8ef;
      }

      @media (max-width: 560px) {
        #page {
          padding: 34px 16px 48px;
        }

        #hero {
          align-items: flex-start;
          display: block;
        }

        .remove-all-button {
          margin-top: 16px;
        }

        .reading-row {
          gap: 10px;
        }

        .reading-progress {
          min-width: 50px;
        }

        .progress-track {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="page">
      <div id="hero">
        <div class="hero-copy">
          <div id="hero-title">Currently reading</div>
          <div id="hero-sub">Your five most recently opened reading items.</div>
        </div>
        <button id="remove-all-button" class="remove-all-button" type="button" hidden>
          Remove all
        </button>
      </div>
      <div id="status" aria-live="polite"></div>
      <div id="list"></div>
    </main>

    <div
      id="remove-all-modal"
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="remove-all-title"
      hidden
    >
      <div class="modal-card">
        <h2 id="remove-all-title" class="modal-title">Remove all saved reading items?</h2>
        <p class="modal-copy">
          This will clear every saved reading position from this browser. This action cannot be undone.
        </p>
        <div class="modal-actions">
          <button id="remove-all-cancel" class="modal-button" type="button">
            Cancel
          </button>
          <button id="remove-all-confirm" class="modal-button modal-button--danger" type="button">
            Remove all
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var THEME_KEY = "ee7-theme";

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
        }

        try {
          applyTheme(localStorage.getItem(THEME_KEY) || "dusk");
        } catch (e) {
          applyTheme("dusk");
        }

        window.addEventListener("message", function (event) {
          if (event.data && event.data.type === "ee7-theme") {
            applyTheme(event.data.theme);
          }
        });

        var list = document.getElementById("list");
        var removeAllButton = document.getElementById("remove-all-button");
        var removeAllModal = document.getElementById("remove-all-modal");
        var removeAllCancel = document.getElementById("remove-all-cancel");
        var removeAllConfirm = document.getElementById("remove-all-confirm");
        var returnFocus = null;

        function closeRemoveAllModal() {
          removeAllModal.hidden = true;
          if (returnFocus && returnFocus.focus) returnFocus.focus();
          returnFocus = null;
        }

        function openRemoveAllModal() {
          if (!window.EE7ReadingState || !window.EE7ReadingState.read().length) {
            return;
          }
          returnFocus = document.activeElement;
          removeAllModal.hidden = false;
          removeAllConfirm.focus();
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function render() {
          var items = window.EE7ReadingState ? window.EE7ReadingState.read() : [];
          removeAllButton.hidden = !items.length;
          if (!items.length) {
            list.innerHTML =
              '<div class="reading-empty">Open a book, discourse, or story to start building your reading list.</div>';
            document.getElementById("status").textContent = "";
            closeRemoveAllModal();
            return;
          }

          list.innerHTML = items
            .map(function (item) {
              var percent = Math.round(item.progress * 100);
              return (
                '<article class="reading-row">' +
                '<div class="reading-main">' +
                '<a class="reading-title" href="' +
                escapeHtml(item.href) +
                '" target="Client">' +
                escapeHtml(item.title) +
                "</a>" +
                '<div class="reading-meta">Resume where you left off</div>' +
                "</div>" +
                '<div class="reading-progress" aria-label="' +
                percent +
                '% read">' +
                '<div class="progress-track"><div class="progress-fill" style="width:' +
                percent +
                '%"></div></div>' +
                '<span class="progress-label">' +
                percent +
                "%</span></div>" +
                '<button class="reading-remove" type="button" data-reading-delete="' +
                escapeHtml(item.href) +
                '">Remove</button></article>'
              );
            })
            .join("");
          document.getElementById("status").textContent =
            items.length + " reading item" + (items.length === 1 ? "" : "s");
        }

        list.addEventListener("click", function (event) {
          var deleteButton = event.target.closest("[data-reading-delete]");
          if (deleteButton) {
            event.preventDefault();
            event.stopPropagation();
            if (window.EE7ReadingState) {
              window.EE7ReadingState.remove(
                deleteButton.getAttribute("data-reading-delete"),
              );
              render();
            }
            return;
          }
          var link = event.target.closest("a.reading-title[href]");
          if (!link || window.parent === window) return;
          event.preventDefault();
          window.parent.postMessage(
            { type: "ee7-navigate", href: link.getAttribute("href") },
            "*",
          );
        });

        removeAllButton.addEventListener("click", openRemoveAllModal);
        removeAllCancel.addEventListener("click", closeRemoveAllModal);
        removeAllConfirm.addEventListener("click", function () {
          if (window.EE7ReadingState) window.EE7ReadingState.clear();
          closeRemoveAllModal();
          render();
        });
        removeAllModal.addEventListener("click", function (event) {
          if (event.target === removeAllModal) closeRemoveAllModal();
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && !removeAllModal.hidden) {
            closeRemoveAllModal();
          }
        });

        window.addEventListener("storage", function (event) {
          if (event && event.key === "ee7-currently-reading") render();
        });
        window.addEventListener("ee7-reading-changed", render);
        window.addEventListener("load", render);
      })();
    </script>
  </body>
</html>
