      #friend-prank {
        bottom: 16px;

        left: clamp(14px, 3vw, 36px);
        opacity: 0;
        pointer-events: none;
        position: fixed;
        transform: translate3d(0, calc(100% + 32px), 0) scale(0.88);
        transform-origin: 50% 100%;
        transition:
          opacity 0.25s ease-out,
          transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
          visibility 0s linear 0.72s;
        visibility: hidden;
        width: auto;
        z-index: 20;
      }

      #friend-prank.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        transition-delay: 0s;
        visibility: visible;
      }

      #friend-prank img {
        aspect-ratio: 4 / 5;
        display: block;
        height: min(22svh, 230px);
        object-fit: cover;
        object-position: center 42%;
        width: auto;
      }

          max-height: none;

          padding-bottom: 6px;
        }

        #friend-prank {
          bottom: 12px;
          left: 12px;
        }
      }

        #friend-prank {
          transition: opacity 0.2s ease-out;
        }

      /* Text lines follow the image mask; no extra surfaces cover the artwork. */
      #quote-sheet { width: min(100%, 690px, calc((100svh - 110px) * .75)); max-height: none; }
      #quote-sheet::before { content: none; }
      #quote-copy { inset: 0; width: 100%; max-width: none; padding: 0; border: 0; background: none; transform: none; }
      #quote-text { position: absolute; inset: 0; margin: 0; font-size: inherit; letter-spacing: 0; }
      #quote-text::before { content: none; }

  <body>
    <main id="quote-app">
      <div id="quote-stage">
        <article id="quote-sheet" aria-labelledby="quote-text">
          <div id="quote-content">
            <div class="quote-copy" id="quote-copy">
              <blockquote id="quote-text"></blockquote>
              <div id="quote-source" hidden>
                <span id="quote-source-label">From</span>
                <a id="quote-source-link" target="_blank" rel="noopener noreferrer"></a>
              </div>
            </div>
          </div>
        </article>
        <div id="quote-error" role="status">
          This shared quote link is missing its passage. <a href="index.html">Return to the reader</a>.
        </div>
      </div>
      <nav id="quote-toolbar" aria-label="Quote actions">
        <button class="quote-tool" id="copy-link" type="button">Copy link</button>
        <button class="quote-tool" id="change-background" type="button">Change background</button>
        <button class="quote-tool" id="download-image" type="button">Download image</button>
        <span id="quote-status" aria-live="polite"></span>
      </nav>
    </main>

    <div id="friend-prank" hidden aria-hidden="true">
      <img src="Images/friend-prank.jpg" alt="Surprise face" />
    </div>

    <script>
      (function () {
        "use strict";

        var PRANK_KEY = "ee7-friend-prank-enabled";
        var PRANK_DELAY = 60 * 1000;
        var BACKGROUND_COUNT = 38;
        var url = new URL(window.location.href);
        var prankEnabled = false;
        var prankTimer = null;
        var prankVisible = false;
        var backgroundIndex = 0;
        var fitFrame = null;
        var passage = "";
        var prankNode = document.getElementById("friend-prank");
        var sheet = document.getElementById("quote-sheet");
        var copy = document.getElementById("quote-copy");
        var quoteText = document.getElementById("quote-text");
        var source = document.getElementById("quote-source");
        var sourceLink = document.getElementById("quote-source-link");
        var copyLink = document.getElementById("copy-link");
        var changeBackground = document.getElementById("change-background");
        var downloadImage = document.getElementById("download-image");
        var status = document.getElementById("quote-status");
        var error = document.getElementById("quote-error");

        function closePrankParam() {
          var value = url.searchParams.get("p");
          try {
            prankEnabled = localStorage.getItem(PRANK_KEY) === "true";
          } catch (e) {}

          if (value === "true") {
            prankEnabled = true;
            try {
              localStorage.setItem(PRANK_KEY, "true");
            } catch (e2) {}
          } else if (value === "off" || value === "false") {
            prankEnabled = false;
            try {
              localStorage.removeItem(PRANK_KEY);
            } catch (e3) {}
          } else if (!prankEnabled) {
            return;
          }

          if (value === "true" || value === "off" || value === "false") {
            url.searchParams.delete("p");
            window.history.replaceState(
              window.history.state,
              "",
              url.pathname + url.search + url.hash,
            );
          }
        }

        function revealPrank() {
          prankTimer = null;
          if (!prankEnabled || prankVisible) return;
          prankVisible = true;
          prankNode.removeAttribute("hidden");
          prankNode.setAttribute("aria-hidden", "false");
          window.requestAnimationFrame(function () {
            prankNode.classList.add("is-visible");
          });
        }

        function schedulePrank() {
          if (!prankEnabled || prankTimer !== null || prankVisible) return;
          prankTimer = window.setTimeout(revealPrank, PRANK_DELAY);
        }

        function sharedQuote() {
          var payload = window.EE7Quotes
            ? window.EE7Quotes.decodeSharePayload(url.searchParams.get("q"))
            : null;
          if (payload) return payload;

          var id = url.searchParams.get("id");
          if (!id || !window.EE7Quotes) return null;
          var items = window.EE7Quotes.readQuotes();
          for (var i = 0; i < items.length; i++) {
            if (items[i].id === id) return items[i];
          }
          return null;
        }

        function setQuoteSource(payload) {
          if (!payload.href) return;
          sourceLink.href = payload.href;
          sourceLink.textContent = payload.title || payload.href;
          source.removeAttribute("hidden");
        }

        function prepareShareLinks() {
          var cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete("p");
          copyLink.setAttribute("data-share-url", cleanUrl.href);
        }

        function fitQuoteCopy() {
          if (sheet.hidden || !passage) return;
          if (fitFrame !== null) cancelAnimationFrame(fitFrame);
          fitFrame = requestAnimationFrame(function () {
            fitFrame = null;
            window.layoutQuoteArtwork(backgroundIndex, passage, sourceLink.textContent, sourceLink.getAttribute("href"));
          });
        }

        function backgroundClass(index) {
          return "bg-" + String(index + 1).padStart(2, "0");
        }

        function applyBackground(index, announce) {
          backgroundIndex = (index + BACKGROUND_COUNT) % BACKGROUND_COUNT;
          sheet.className = backgroundClass(backgroundIndex);
          copy.className = "quote-copy";
          if (announce) {
            status.textContent =
              "Background " + (backgroundIndex + 1) + " of " + BACKGROUND_COUNT;
          }
          fitQuoteCopy();
        }

        function copyText(value) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(value);
          }
          return new Promise(function (resolve, reject) {
            var field = document.createElement("textarea");
            field.value = value;
            field.setAttribute("readonly", "true");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            try {
              document.execCommand("copy");
              resolve();
            } catch (e) {
              reject(e);
            }
            document.body.removeChild(field);
          });
        }

        function backgroundImageUrl() {
          var imageValue = window.getComputedStyle(sheet).backgroundImage || "";
          var match = imageValue.match(/url\((?:"|')?(.+?)(?:"|')?\)/);
          return match ? new URL(match[1], document.baseURI).href : "";
        }

        function loadImage(urlValue) {
          return new Promise(function (resolve, reject) {
            var image = new Image();
            image.onload = function () {
              resolve(image);
            };
            image.onerror = reject;
            image.src = urlValue;
          });
        }

        function escapeXml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&apos;");
        }

        function quoteFileName(extension) {
          var title = (document.title || "shared-quote")
            .replace(/\s+-\s+EE 7\+$/i, "")
            .replace(/[^a-z0-9]+/gi, "-")
            .replace(/^-+|-+$/g, "")
            .toLowerCase() || "shared-quote";
          return title + "." + extension;
        }

        function saveBlob(blob, fileName) {
          var link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(function () {
            URL.revokeObjectURL(link.href);
          }, 1000);
        }

        function downloadQuoteSvg() {
          var sheetRect = sheet.getBoundingClientRect();
          var outputWidth = Math.max(
            1080,
            Math.min(1600, Math.round(sheetRect.width * 2)),
          );
          var outputHeight = Math.round(
            outputWidth * (sheetRect.height / sheetRect.width),
          );
          var scale = outputWidth / sheetRect.width;
          var computedSheet = window.getComputedStyle(sheet);
          var imageUrl = escapeXml(backgroundImageUrl());
          var svg = [
            '<svg xmlns="http://www.w3.org/2000/svg" width="',
            outputWidth,
            '" height="',
            outputHeight,
            '" viewBox="0 0 ',
            outputWidth,
            " ",
            outputHeight,
            '">',
            '<rect width="100%" height="100%" fill="',
            escapeXml(computedSheet.backgroundColor),
            '"/>',
            '<image href="',
            imageUrl,
            '" x="0" y="0" width="',
            outputWidth,
            '" height="',
            outputHeight,
            '" preserveAspectRatio="xMidYMid slice"/>',
          ];
          document.querySelectorAll(".artwork-line").forEach(function (line) {
            var lineRect = line.getBoundingClientRect();
            var computed = window.getComputedStyle(line);
            var fontSize = parseFloat(computed.fontSize) || 16;
            var lineHeight = parseFloat(computed.lineHeight) || fontSize * 1.3;
            var x = (lineRect.left - sheetRect.left) * scale;
            var y =
              (lineRect.top -
                sheetRect.top +
                (lineHeight - fontSize) / 2 +
                fontSize * 0.84) *
              scale;
            svg.push(
              '<text x="',
              x.toFixed(2),
              '" y="',
              y.toFixed(2),
              '" fill="',
              escapeXml(computed.color),
              '" font-family="',
              escapeXml(computed.fontFamily),
              '" font-size="',
              (fontSize * scale).toFixed(2),
              'px" font-style="',
              escapeXml(computed.fontStyle),
              '" font-weight="',
              escapeXml(computed.fontWeight),
              '">',
              escapeXml(line.textContent),
              "</text>",
            );
          });
          svg.push("</svg>");
          saveBlob(
            new Blob([svg.join("")], { type: "image/svg+xml" }),
            quoteFileName("svg"),
          );
        }

        function drawCoverImage(context, image, width, height) {
          var scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
          var drawnWidth = image.naturalWidth * scale;
          var drawnHeight = image.naturalHeight * scale;
          context.drawImage(
            image,
            (width - drawnWidth) / 2,
            (height - drawnHeight) / 2,
            drawnWidth,
            drawnHeight,
          );
        }

        function drawQuoteLine(context, line, sheetRect, scale) {
          var lineRect = line.getBoundingClientRect();
          var computed = window.getComputedStyle(line);
          var fontSize = parseFloat(computed.fontSize) || 16;
          var lineHeight = parseFloat(computed.lineHeight) || fontSize * 1.3;
          context.fillStyle = computed.color || "#242321";
          context.font = [
            computed.fontStyle,
            computed.fontWeight,
            (fontSize * scale).toFixed(2) + "px",
            computed.fontFamily,
          ].join(" ");
          context.textAlign = "left";
          context.textBaseline = "alphabetic";
          context.fillText(
            line.textContent,
            (lineRect.left - sheetRect.left) * scale,
            (lineRect.top - sheetRect.top + (lineHeight - fontSize) / 2 + fontSize * 0.84) * scale,
          );
        }

        function downloadQuoteImage() {
          if (sheet.hidden || !passage) return;
          status.textContent = "Preparing image...";
          Promise.resolve(document.fonts && document.fonts.ready)
            .then(function () {
              return loadImage(backgroundImageUrl());
            })
            .then(function (image) {
              var sheetRect = sheet.getBoundingClientRect();
              var outputWidth = Math.max(
                1080,
                Math.min(1600, Math.round(sheetRect.width * 2)),
              );
              var outputHeight = Math.round(
                outputWidth * (sheetRect.height / sheetRect.width),
              );
              var canvas = document.createElement("canvas");
              canvas.width = outputWidth;
              canvas.height = outputHeight;
              var context = canvas.getContext("2d");
              context.fillStyle = window.getComputedStyle(sheet).backgroundColor;
              context.fillRect(0, 0, outputWidth, outputHeight);
              drawCoverImage(context, image, outputWidth, outputHeight);
              document.querySelectorAll(".artwork-line").forEach(function (line) {
                drawQuoteLine(context, line, sheetRect, outputWidth / sheetRect.width);
              });
              return new Promise(function (resolve, reject) {
                canvas.toBlob(function (blob) {
                  if (blob) resolve(blob);
                  else reject(new Error("Could not create the image"));
                }, "image/png");
              });
            })
            .then(function (blob) {
              saveBlob(blob, quoteFileName("png"));
              status.textContent = "Image downloaded";
            })
            .catch(function () {
              try {
                downloadQuoteSvg();
                status.textContent = "Image downloaded as SVG";
              } catch (e) {
                status.textContent = "Image download failed";
              }
            });
        }

        function render() {
          var payload = sharedQuote();
          if (!payload) {
            sheet.hidden = true;
            document.getElementById("quote-toolbar").hidden = true;
            error.classList.add("is-visible");
            return;
          }

          passage = payload.text;
          setQuoteSource(payload);
          backgroundIndex = Math.floor(Math.random() * BACKGROUND_COUNT);
          applyBackground(backgroundIndex, false);
          prepareShareLinks();
          document.title = (payload.title || "Shared quote") + " - EE 7+";
          fitQuoteCopy();
        }

        copyLink.addEventListener("click", function () {
          var value = this.getAttribute("data-share-url");
          if (!value) return;
          copyText(value)
            .then(function () {
              status.textContent = "Link copied";
            })
            .catch(function () {
              status.textContent = "Copy failed. Use the address bar to share it.";
            });
        });

        changeBackground.addEventListener("click", function () {
          applyBackground(backgroundIndex + 1, true);
        });

        downloadImage.addEventListener("click", downloadQuoteImage);

        closePrankParam();
        render();
        schedulePrank();
        window.addEventListener("resize", fitQuoteCopy);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(fitQuoteCopy);
        }

      })();
    </script>
  </body>
</html>
